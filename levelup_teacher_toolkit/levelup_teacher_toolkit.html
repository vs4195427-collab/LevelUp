  <style>
    :root {
      --bg-grad: radial-gradient(circle at 18% 20%, rgba(219, 234, 254, 0.72) 0%, rgba(238, 242, 255, 0.65) 45%, rgba(243, 232, 255, 0.6) 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }
    body.dark-theme {
      --bg-grad: radial-gradient(circle at 18% 20%, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
      --card-bg: rgba(30, 41, 59, 0.92);
      --card-border: rgba(71, 85, 105, 0.45);
      --text-main: #f8fafc;
      color: #f8fafc;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
    }
    body.dark-theme .glass-card {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    /* High-contrast Dark Mode overrides */
    body.dark-theme .text-slate-900 { color: #f8fafc !important; }
    body.dark-theme .text-slate-800 { color: #e2e8f0 !important; }
    body.dark-theme .text-slate-700 { color: #cbd5e1 !important; }
    body.dark-theme .text-slate-600 { color: #94a3b8 !important; }
    body.dark-theme .text-slate-500 { color: #94a3b8 !important; }
    body.dark-theme .bg-white { background-color: #1e293b !important; color: #f8fafc !important; }
    body.dark-theme .bg-slate-50,
    body.dark-theme .bg-slate-50\/70,
    body.dark-theme .bg-slate-50\/80,
    body.dark-theme .bg-slate-50\/90 { background-color: rgba(15, 23, 42, 0.65) !important; }
    body.dark-theme .bg-slate-100 { background-color: #334155 !important; }
    body.dark-theme .border-slate-100,
    body.dark-theme .border-slate-200,
    body.dark-theme .border-slate-200\/60,
    body.dark-theme .border-slate-200\/70,
    body.dark-theme .border-slate-200\/80 { border-color: rgba(71, 85, 105, 0.55) !important; }

    /* Keep printable area crisp white even in dark mode for accurate PDF export */
    .pdf-capture-surface {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    .pdf-capture-surface .text-slate-900 { color: #0f172a !important; }
    .pdf-capture-surface .text-slate-800 { color: #1e293b !important; }
    .pdf-capture-surface .text-slate-700 { color: #334155 !important; }
    .pdf-capture-surface .text-slate-600 { color: #475569 !important; }
    .pdf-capture-surface .text-slate-500 { color: #64748b !important; }
    .pdf-capture-surface .bg-white { background-color: #ffffff !important; color: #0f172a !important; }
    .pdf-capture-surface .bg-slate-50\/70 { background-color: #f8fafc !important; }

    /* B/W High-Contrast Worksheet Mode */
    .bw-worksheet-mode {
      filter: grayscale(100%) contrast(125%);
      background: #ffffff !important;
      color: #000000 !important;
      border: 2px solid #000000 !important;
    }
    .bw-worksheet-mode * {
      color: #000000 !important;
      border-color: #000000 !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    @media print {
      body, body.dark-theme {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-sheet {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
    }
    /* Calmer, task-first workspace */
    :root { --bg-grad:#f7f7f2; --card-bg:#fff; --card-border:#e5e9e2; --text-main:#20302a; }
    body { line-height:1.55; }
    .glass-card { backdrop-filter:none; box-shadow:0 2px 12px rgba(33,54,41,.035); }
    #appSidebar > .glass-card { border-radius:0 24px 24px 0; background:#fff; }
    #appSidebar .nav-tab, #studentNavBar .stu-nav-tab { min-height:42px; }
    #appSidebar .nav-tab.bg-blue-600, #studentNavBar .stu-nav-tab.bg-purple-600 { background:#25644b !important; color:white !important; }
    #brandHomeBtn > div:first-child { background:#25644b; }
    #brandSubtitleBadge { background:#edf5ee; color:#25644b; border-color:#dbe8dd; }
    #appMainContainer { max-width:1200px; width:100%; margin-left:auto; margin-right:auto; }
    #headerBreadcrumb, #lumiFloatingTrigger { display:none; }
    #lumiSidebarBtn { background:#25644b; }
    .sidebar-more summary { list-style:none; }
    .sidebar-more summary::-webkit-details-marker { display:none; }
    .workspace-intro { padding:8px 2px 2px; }
    .workspace-intro h1 { font-size:clamp(1.45rem,2.5vw,2rem); font-weight:800; letter-spacing:-.04em; }
    .workspace-intro p { color:#64736b; font-size:.9rem; margin-top:2px; }
    .insights-disclosure, .student-details { border:1px solid #e2e9e1; background:#fff; border-radius:22px; overflow:hidden; }
    .insights-disclosure > summary, .student-details > summary { cursor:pointer; padding:18px 22px; font-weight:750; color:#25644b; list-style:none; }
    .insights-disclosure > summary::-webkit-details-marker, .student-details > summary::-webkit-details-marker { display:none; }
    .insights-disclosure > summary::after, .student-details > summary::after { content:'⌄'; float:right; }
    .insights-disclosure[open] > summary::after, .student-details[open] > summary::after { transform:rotate(180deg); }
    .insights-disclosure > .insights-content, .student-details > .student-details-content { padding:0 18px 20px; }
    body.student-mode #headerClassSwitcherWrap, body.student-mode #headerContextSub, body.student-mode #avatarProfileBtn, body.student-mode #lumiSidebarBtn, body.student-mode #lumiHeaderBtn, body.student-mode #mobileBottomNav { display:none !important; }
    body.student-mode #appMainContainer { max-width:960px; }
    .student-next { background:#ebf5ed; border:1px solid #cfe4d3; border-radius:24px; padding:22px; }
    .student-next h2 { font-size:1.3rem; font-weight:800; color:#214b38; }
    .student-next p { color:#456052; margin:5px 0 16px; }
    .student-next-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .student-next-actions button { background:#25644b; color:white; border-radius:14px; padding:11px 16px; font-weight:700; }
    .student-next-actions button + button { background:#fff; color:#25644b; border:1px solid #bfdbc5; }
    @media(max-width:640px) { #appSidebar > .glass-card { border-radius:0 20px 20px 0; } #appMainContainer { padding-left:14px; padding-right:14px; } #mobileBottomNav { padding-bottom:max(8px,env(safe-area-inset-bottom)); } .student-next-actions button { width:100%; } body.student-mode #appMainContainer { padding-bottom:24px; } }
    :focus-visible { outline:3px solid #e6a96d !important; outline-offset:2px; }
    @media(min-width:1024px) { .student-section-pills { display:none; } }
  </style>

    // Enriches each student record with authentic historical weekly snapshots (Wk 1, Wk 2, Wk 3),
    // explicit assessed/unassessed status flags, per-topic competency scores, and question exposure logs.
    function enrichStudentsWithDynamicHistory(rawStudents, classKey) {
      return rawStudents.map((stu, idx) => {
        // In Grade 3A (24 students), 22 are assessed in Week 4 and 2 (Roll 22 Fatima, Roll 24 Tara)
        // start as "Not Yet Assessed in Week 4" so the stacked bar chart & coverage banner
        // accurately distinguish Assessed (22) vs Not Yet Assessed (2) until assessed!
        const isPendingWk4 = (classKey === 'g3a' && (stu.roll === 22 || stu.roll === 24));
        const rAssessed = typeof stu.rAssessed === 'boolean' ? stu.rAssessed : !isPendingWk4;
        const mAssessed = typeof stu.mAssessed === 'boolean' ? stu.mAssessed : !isPendingWk4;

        // Immutable historical weekly levels for Wk 1, Wk 2, Wk 3
        const rWk1 = stu.rBase || 'R1';
        const rWk2 = (idx % 3 === 0 && rWk1 !== stu.rCurr) ? stu.rCurr : rWk1;
        const rWk3 = (idx % 2 === 0) ? stu.rCurr : rWk2;
        const rHistory = Array.isArray(stu.rHistory) && stu.rHistory.length === 3 ? stu.rHistory : [rWk1, rWk2, rWk3];

        const mWk1 = stu.mBase || 'M1';
        const mWk2 = (idx % 3 === 1 && mWk1 !== stu.mCurr) ? stu.mCurr : mWk1;
        const mWk3 = (idx % 2 === 1) ? stu.mCurr : mWk2;
        const mHistory = Array.isArray(stu.mHistory) && stu.mHistory.length === 3 ? stu.mHistory : [mWk1, mWk2, mWk3];

        // Per-topic competency mastery scores (0-100) derived from student's actual skill profile
        const rBaseScore = Math.max(22, (stu.rScore || 60) - 16);
        const mBaseScore = Math.max(20, (stu.mScore || 60) - 15);
        const defaultTopicScores = {
          letter_sounds: Math.min(98, Math.max(30, stu.rScore + 14)),
          word_rec: Math.min(96, Math.max(28, stu.rScore + 11)),
          sentence_reading: Math.min(95, Math.max(24, stu.rScore - 6)),
          story_comp: Math.min(92, Math.max(18, stu.rScore - 26)),
          grammar_basics: Math.min(92, Math.max(18, stu.rScore - 27)),
          number_sense: Math.min(98, Math.max(32, stu.mScore + 16)),
          add_no_carry: Math.min(96, Math.max(28, stu.mScore + 9)),
          tens_ones: Math.min(94, Math.max(25, stu.mScore - 3)),
          sub_no_borrow: Math.min(92, Math.max(22, stu.mScore - 10)),
          sub_borrow: Math.min(90, Math.max(16, stu.mScore - 24)),
          fractions: Math.min(88, Math.max(15, stu.mScore - 29))
        };
        const topicScores = Object.assign({}, defaultTopicScores, stu.topicScores || {});
        const topicBaseline = Object.assign({
          letter_sounds: Math.max(20, topicScores.letter_sounds - 17),
          word_rec: Math.max(20, topicScores.word_rec - 16),
          sentence_reading: Math.max(18, topicScores.sentence_reading - 18),
          story_comp: Math.max(15, topicScores.story_comp - 15),
          grammar_basics: Math.max(15, topicScores.grammar_basics - 14),
          number_sense: Math.max(22, topicScores.number_sense - 19),
          add_no_carry: Math.max(20, topicScores.add_no_carry - 17),
          tens_ones: Math.max(18, topicScores.tens_ones - 16),
          sub_no_borrow: Math.max(16, topicScores.sub_no_borrow - 15),
          sub_borrow: Math.max(14, topicScores.sub_borrow - 14),
          fractions: Math.max(12, topicScores.fractions - 12)
        }, stu.topicBaseline || {});

        return Object.assign({}, stu, {
          rAssessed,
          mAssessed,
          rBaseScore,
          mBaseScore,
          rHistory,
          mHistory,
          topicScores,

    // Deterministic seeded shuffle so each attempt seed gets a fresh, reproducible non-repeating selection
    function seededShuffle(array, seedNum) {
      const arr = [...array];
      let s = (Number(seedNum) || 1) + 1013904223;
      for (let i = arr.length - 1; i > 0; i--) {
        s = (s * 1664525 + 1013904223) % 4294967296;
        const j = Math.abs(s) % (i + 1);
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function generateCompetencyQuestionSet(competencyCode, requestedCount = 5, difficultyMode = 'Balanced Progression', studentId = null, seedOffset = 1) {
      const count = Math.max(1, Math.min(25, Number(requestedCount) || 5));
      const fullPool = buildCompetencyCandidatePool(competencyCode);
      const stu = studentId ? state.students.find(s => s.id === Number(studentId)) : null;
      const seenSigs = new Set((stu && Array.isArray(stu.seenQuestionSignatures)) ? stu.seenQuestionSignatures : []);

      // Filter by difficulty preference if specific tier requested, with fallback to full competency pool
      let preferredPool = fullPool;
      if (difficultyMode === 'Foundational Support' || difficultyMode === 'Concrete + Visual Hints') {
        preferredPool = fullPool.filter(q => q.difficulty === 'easy' || q.difficulty === 'medium');
      } else if (difficultyMode === 'Stretch & Application' || difficultyMode === 'Grade 3 Frontier') {
        preferredPool = fullPool.filter(q => q.difficulty === 'medium' || q.difficulty === 'stretch');
      }
      if (preferredPool.length < count) preferredPool = fullPool;

      // Prioritize questions the student has NOT seen yet
      const unseen = preferredPool.filter(q => !seenSigs.has(q.canonicalSignature));
      const seen = preferredPool.filter(q => seenSigs.has(q.canonicalSignature));
      const otherUnseen = fullPool.filter(q => !preferredPool.includes(q) && !seenSigs.has(q.canonicalSignature));
      const otherSeen = fullPool.filter(q => !preferredPool.includes(q) && seenSigs.has(q.canonicalSignature));

      const orderedCandidates = [
        ...seededShuffle(unseen, seedOffset * 17 + (studentId || 3)),
        ...seededShuffle(otherUnseen, seedOffset * 23 + 7),
        ...seededShuffle(seen, seedOffset * 31 + 11),
        ...seededShuffle(otherSeen, seedOffset * 43 + 19)
      ];

      const selected = [];
      const usedSignatures = new Set();
      const usedPrompts = new Set();

      for (const cand of orderedCandidates) {
        if (selected.length >= count) break;
        if (usedSignatures.has(cand.canonicalSignature) || usedPrompts.has(cand.q)) continue;
        usedSignatures.add(cand.canonicalSignature);
        usedPrompts.add(cand.q);
        // Shuffle options deterministically while preserving exact answer string
        const shuffledOpts = seededShuffle(cand.options, seedOffset + selected.length * 13);
        selected.push(Object.assign({}, cand, { options: shuffledOpts }));
      }

      return selected;
    }

    // ============================================================================
    // DYNAMIC ANALYTICS ENGINE (PHASE 2: LIVE LEVEL DISTRIBUTIONS & TOPIC HEATMAP)
    // ============================================================================
    function computeDynamicClassAnalytics(subject) {
      const isReading = subject === 'reading';
      const l1Code = isReading ? 'R1' : 'M1';
      const l2Code = isReading ? 'R2' : 'M2';
      const l3Code = isReading ? 'R3' : 'M3';
      const rank = { R1: 1, R2: 2, R3: 3, M1: 1, M2: 2, M3: 3 };

      const totalStudents = state.students.length;
      const assessedStudents = state.students.filter(s => isReading ? s.rAssessed !== false : s.mAssessed !== false);
      const unassessedStudents = state.students.filter(s => isReading ? s.rAssessed === false : s.mAssessed === false);

      // Historical Week 1, Week 2, Week 3 counts from each student's immutable rHistory / mHistory
      const countWeekHist = (wkIdx) => {
        let l1 = 0, l2 = 0, l3 = 0;
        state.students.forEach(s => {
          const hist = isReading ? (s.rHistory || [s.rBase, s.rBase, s.rCurr]) : (s.mHistory || [s.mBase, s.mBase, s.mCurr]);
          const lvl = hist[wkIdx] || (isReading ? s.rBase : s.mBase);
          if (lvl === l1Code) l1++;
          else if (lvl === l2Code) l2++;
          else l3++;
        });
        return { l1, l2, l3, unassessed: 0, assessed: totalStudents };
      };

      const wk1 = countWeekHist(0);
      const wk2 = countWeekHist(1);
      const wk3 = countWeekHist(2);

      // Week 4 (Current) dynamically distinguishes Assessed vs Not Yet Assessed
      let wk4L1 = 0, wk4L2 = 0, wk4L3 = 0;
      let improvedCount = 0, sameLevelCount = 0, decreasedCount = 0, totalGainPts = 0;

      assessedStudents.forEach(s => {
        const curr = isReading ? s.rCurr : s.mCurr;
        const base = isReading ? s.rBase : s.mBase;
        if (curr === l1Code) wk4L1++;
        else if (curr === l2Code) wk4L2++;
        else wk4L3++;

        if (rank[curr] > rank[base]) improvedCount++;
        else if (rank[curr] === rank[base]) sameLevelCount++;
        else decreasedCount++;

        const currSc = isReading ? (s.rScore || 60) : (s.mScore || 60);
        const baseSc = isReading ? (s.rBaseScore || Math.max(20, currSc - 16)) : (s.mBaseScore || Math.max(20, currSc - 15));
        totalGainPts += (currSc - baseSc);
      });

      const wk4 = {
        l1: wk4L1,
        l2: wk4L2,
        l3: wk4L3,
        unassessed: unassessedStudents.length,
        assessed: assessedStudents.length
      };

      const avgGainPts = assessedStudents.length > 0 ? (totalGainPts / assessedStudents.length).toFixed(1) : '0.0';

      return {
        totalStudents,
        assessedCount: assessedStudents.length,
        unassessedCount: unassessedStudents.length,
        unassessedNames: unassessedStudents.map(s => s.name),
        improvedCount,
        sameLevelCount,
        decreasedCount,
        avgGainPts,
        weeksData: [
          { label: 'Wk 1 (Base)', shortLabel: 'Wk 1', ...wk1 },
          { label: 'Wk 2', shortLabel: 'Wk 2', ...wk2 },
          { label: 'Wk 3', shortLabel: 'Wk 3', ...wk3 },
          { label: 'Wk 4 (Now)', shortLabel: 'Wk 4', ...wk4 }
        ]
      };
    }

    function computeDynamicTopicStats(subject) {
      const isReading = subject === 'reading';
      const baseTopics = TOPICS[subject] || [];
      const assessedStudents = state.students.filter(s => isReading ? s.rAssessed !== false : s.mAssessed !== false);
      const unassessedStudents = state.students.filter(s => isReading ? s.rAssessed === false : s.mAssessed === false);
      const denom = Math.max(1, assessedStudents.length);

      const enriched = baseTopics.map(t => {
        let sumNow = 0;
        let sumBase = 0;
        const demonstrated = [];
        const developing = [];
        const emerging = [];
        const followup = [];

        assessedStudents.forEach(s => {
          const sc = (s.topicScores && typeof s.topicScores[t.id] === 'number') ? s.topicScores[t.id] : (isReading ? s.rScore : s.mScore);
          const bSc = (s.topicBaseline && typeof s.topicBaseline[t.id] === 'number') ? s.topicBaseline[t.id] : Math.max(18, sc - 15);
          sumNow += sc;
          sumBase += bSc;
          if (sc >= 75) demonstrated.push(s);
          else if (sc >= 55) developing.push(s);
          else if (sc >= 40) emerging.push(s);
          else followup.push(s);
        });

        const avgPct = Math.round(sumNow / denom);
        const growthPts = Math.max(1, Math.round((sumNow - sumBase) / denom));
        const status = avgPct >= 70 ? 'Strong' : avgPct >= 50 ? 'Improving' : 'Needs work';

        return Object.assign({}, t, {
          avgPct,
          growthPts,
          status,
          badge: null,
          assessedCount: assessedStudents.length,
          unassessedCount: unassessedStudents.length,
          demonstrated,
          developing,
          emerging,
          followup
        });
      });

      if (enriched.length > 1) {
        let maxIdx = 0, minIdx = 0;
        enriched.forEach((item, idx) => {
          if (item.growthPts > enriched[maxIdx].growthPts) maxIdx = idx;
          if (item.growthPts < enriched[minIdx].growthPts) minIdx = idx;
        });
        enriched[maxIdx].badge = 'most improved';
        if (minIdx !== maxIdx) enriched[minIdx].badge = 'least improved';
      }

      return enriched;
    }

    function formatAttendanceDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const dayName = days[d.getDay()] || '';
      const monthName = months[d.getMonth()] || '';
      return `${dayName}, ${parseInt(parts[2], 10)} ${monthName} ${parts[0]}`;
    }

    // ============================================================================
    // AUTOMATIC ROLL NUMBER SHIFTING & RENUMBERING LOGIC
    // ============================================================================
    function insertStudentWithRollShift(newStuObj) {
      let targetRoll = parseInt(newStuObj.roll, 10);
      if (isNaN(targetRoll) || targetRoll < 1) {
        targetRoll = state.students.length + 1;
      }
      // Check if any existing student already has this roll number
      const collisionExists = state.students.some(s => s.roll === targetRoll);
      if (collisionExists) {
        // Shift all students with roll >= targetRoll up by +1 (e.g., if 1 is added when 1 exists, old 1 -> 2, old 2 -> 3, etc.)
        state.students.forEach(s => {
          if (s.roll >= targetRoll) {
            s.roll += 1;
          }
        });
      }
      newStuObj.roll = targetRoll;
      state.students.push(newStuObj);
      // Always keep state.students sorted by roll number ascending
      state.students.sort((a, b) => a.roll - b.roll);
    }

    function removeStudentAndRenumber(studentId) {
      const removed = state.students.find(s => s.id === studentId);
      if (!removed) return null;
      const removedRoll = removed.roll;
      state.students = state.students.filter(s => s.id !== studentId);
      // Shift down rolls greater than removedRoll so roll numbers stay contiguous (1..N)
      state.students.forEach(s => {
        if (s.roll > removedRoll) {
          s.roll -= 1;
        }
      });
      state.students.sort((a, b) => a.roll - b.roll);
      return removed;
    }

    function exportElementToPdfOrPrint(elementId, filename) {
      const el = document.getElementById(elementId);
      if (!el) {
        showToast('Could not locate printable sheet area.');
        return;
      }
      showToast(`Generating ${filename}...`, 'info');

      if (window.html2pdf) {
        const opt = {
          margin: [10, 10, 10, 10],
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        window.html2pdf().set(opt).from(el).save().then(() => {
          showToast(`Downloaded ${filename}!`, 'success');
        }).catch(() => {
          window.print();
        });
      } else {
        window.print();
      }
    }

      const bgClass = type === 'success' ? 'bg-slate-900 text-white' : 'bg-blue-600 text-white';

      toast.innerHTML = `

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    // COMPETENCY STATUS & SVG QR GENERATOR HELPERS
    // ============================================================================
    function getCompetencyStatusForStudent(s) {
      if (s.rAssessed === false || s.mAssessed === false) {
        return {
          key: 'unassessed',
          label: tDict().statusLabels.unassessed || 'Not Yet Assessed',
          badgeClass: 'bg-slate-100 text-slate-700 border border-slate-300'
        };
      }
      const avg = Math.round(((s.rScore || 50) + (s.mScore || 50)) / 2);
      if (s.rScore < 45 || s.mScore < 45) {
        return {
          key: 'followup',
          label: tDict().statusLabels.followup,
          badgeClass: 'bg-rose-50 text-rose-700 border border-rose-200'
        };
      }
      if (avg < 60) {
        return {
          key: 'emerging',
          label: tDict().statusLabels.emerging,
          badgeClass: 'bg-amber-50 text-amber-800 border border-amber-200'
        };
      }
      if (avg < 78) {
        return {
          key: 'developing',
          label: tDict().statusLabels.developing,
          badgeClass: 'bg-blue-50 text-blue-700 border border-blue-200'
        };
      }
      return {
        key: 'demonstrated',
        label: tDict().statusLabels.demonstrated,
        badgeClass: 'bg-emerald-50 text-emerald-800 border border-emerald-200'
      };
    }

    function generateQrCodeSvg(codeStr) {
      let hash = 0;
      const str = String(codeStr || 'LU-WS-001');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      let rects = '';
      const size = 9;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const isCorner = (r < 3 && c < 3) || (r < 3 && c >= size - 3) || (r >= size - 3 && c < 3);
          const bit = isCorner ? 1 : ((Math.abs(hash + r * 17 + c * 31) % 3) !== 0 ? 1 : 0);
          if (bit) {
            rects += `<rect x="${c * 6 + 3}" y="${r * 6 + 3}" width="5" height="5" rx="0.8" fill="#0f172a"/>`;
          }
        }
      }
      return `<svg viewBox="0 0 60 60" class="w-14 h-14 border border-slate-300 rounded-lg bg-white p-1 shrink-0" aria-label="QR Code ${escapeHtml(str)}">${rects}</svg>`;
    }

      if (!state.classesCatalog[classId]) return;
      saveState();
      state.activeClassId = classId;
      const target = state.classesCatalog[classId];
      state.classInfo = {
        teacher: target.teacher,
        school: target.school,
        className: target.className,
        grade: target.grade,
        academicYear: target.academicYear
      };
      state.students = target.students;
      state.diagnostic.selectedStudentIndex = 0;
      state.selectedRosterStudentId = (state.students[0] && state.students[0].id) || 1;
      state.trackView.selectedStudentId = (state.students[0] && state.students[0].id) || 1;
      saveState();
      showToast(`Switched active classroom to ${target.className} (${target.students.length} students).`, 'success');

      if (state.activeTab === 'diagnostic' && tabName !== 'diagnostic') {

    function bindClassroomRosterEvents() {
      const alphaBtn = document.getElementById('rosterSortAlphaBtn');
      if (alphaBtn) alphaBtn.addEventListener('click', () => { state.rosterSort = 'alpha'; saveState(); renderApp(); });

      const rollBtn = document.getElementById('rosterSortRollBtn');
      if (rollBtn) rollBtn.addEventListener('click', () => { state.rosterSort = 'roll'; saveState(); renderApp(); });

      const prioBtn = document.getElementById('rosterSortPriorityBtn');
      if (prioBtn) prioBtn.addEventListener('click', () => { state.rosterSort = 'status'; saveState(); renderApp(); });

      const searchIn = document.getElementById('rosterSearchInput');
      if (searchIn) {
        searchIn.addEventListener('input', (e) => {
          state.rosterSearch = e.target.value;
          renderApp();
          const el = document.getElementById('rosterSearchInput');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        });
      }

      const statusSel = document.getElementById('rosterStatusFilterSelect');
      if (statusSel) {
        statusSel.addEventListener('change', (e) => {
          state.rosterFilterStatus = e.target.value;
          saveState();
          renderApp();
        });
      }

      document.querySelectorAll('.roster-row-item').forEach(row => {
        row.addEventListener('click', () => {
          state.selectedRosterStudentId = Number(row.getAttribute('data-select-roster-stu'));
          saveState();
          renderApp();
        });
      });

      const saveNoteBtn = document.getElementById('saveInspectorNoteBtn');
      if (saveNoteBtn) {
        saveNoteBtn.addEventListener('click', () => {
          const stu = state.students.find(s => s.id === state.selectedRosterStudentId) || state.students[0];
          const noteEl = document.getElementById('inspectorTeacherNoteInput');
          if (stu && noteEl) {
            stu.notes = noteEl.value.trim();
            saveState();
            showToast(`Saved observation note for ${stu.name}.`, 'success');
          }
        });
      }

      const addIntvBtn = document.getElementById('addInterventionRecordBtn');
      if (addIntvBtn) {
        addIntvBtn.addEventListener('click', () => {
          const stu = state.students.find(s => s.id === state.selectedRosterStudentId) || state.students[0];
          const sel = document.getElementById('inspectorNewInterventionSelect');
          if (stu && sel) {
            if (!Array.isArray(stu.interventions)) stu.interventions = [];
            stu.interventions.push(sel.value);
            saveState();
            showToast(`Logged intervention "${sel.value}" for ${stu.name}.`, 'success');
            renderApp();
          }
        });
      }

      const diagBtn = document.getElementById('inspectorDiagnoseBtn');
      if (diagBtn) {
        diagBtn.addEventListener('click', () => {
          const idx = state.students.findIndex(s => s.id === state.selectedRosterStudentId);
          state.diagnostic.selectedStudentIndex = idx >= 0 ? idx : 0;
          state.diagnostic.inSession = true;
          state.diagnostic.currentItemIndex = 0;
          state.diagnostic.sessionScores = [];
          state.diagnostic.elapsedSeconds = 0;
          switchTab('diagnostic');
        });
      }

      const attBtn = document.getElementById('rosterGoToAttendanceBtn');
      if (attBtn) {
        attBtn.addEventListener('click', () => switchTab('attendance'));
      }

      const trackStuBtn = document.getElementById('inspectorTrackStudentBtn');
      if (trackStuBtn) {
        trackStuBtn.addEventListener('click', () => {
          state.trackView.mode = 'student';
          state.trackView.selectedStudentId = state.selectedRosterStudentId;
          switchTab('reports');
        });
      }

      const stuPortalBtn = document.getElementById('inspectorStudentPortalBtn');
      if (stuPortalBtn) {
        stuPortalBtn.addEventListener('click', () => {
          state.auth.role = 'student';
          state.auth.studentId = state.selectedRosterStudentId;
          saveState();
          showToast('Switched to Personalized Student Learning Hub.', 'success');
          renderApp();
        });
      }
    }

    function getAttendanceForDate(dateStr, classId = state.activeClassId) {
      if (!state.attendance) state.attendance = {};
      if (!state.attendance.records) state.attendance.records = {};
      if (!state.attendance.records[classId]) state.attendance.records[classId] = {};
      if (!state.attendance.records[classId][dateStr]) {
        state.attendance.records[classId][dateStr] = {};
        const students = (state.classesCatalog[classId] && state.classesCatalog[classId].students) || state.students || [];
        students.forEach(s => {
          state.attendance.records[classId][dateStr][s.id] = {
            status: 'present',
            reason: '',
            recordedAt: dateStr + ' 09:15 AM'
          };
        });
      }
      return state.attendance.records[classId][dateStr];
    }

    function setStudentAttendance(dateStr, studentId, status, reason = '', classId = state.activeClassId) {
      const dayRecs = getAttendanceForDate(dateStr, classId);
      dayRecs[studentId] = {
        status,
        reason: reason !== undefined ? reason : (dayRecs[studentId] ? dayRecs[studentId].reason : ''),
        recordedAt: new Date().toLocaleTimeString()
      };
      saveState();
      renderApp();
    }

    function markAllAttendance(dateStr, status, classId = state.activeClassId) {
      const dayRecs = getAttendanceForDate(dateStr, classId);
      const students = (state.classesCatalog[classId] && state.classesCatalog[classId].students) || state.students || [];
      students.forEach(s => {
        dayRecs[s.id] = {
          status,
          reason: status === 'absent' ? 'Mass absence' : '',
          recordedAt: new Date().toLocaleTimeString()
        };
      });
      saveState();
      const isHi = state.lang === 'hi';
      const msg = status === 'present'
        ? (isHi ? 'सभी छात्रों को उपस्थित चिह्नित किया गया (All Marked Present)' : 'All students marked Present for today.')
        : (isHi ? 'सभी छात्रों को अनुपस्थित चिह्नित किया गया' : 'All students marked Absent for today.');
      showToast(msg, 'success');
      renderApp();
    }

    function getClassAttendanceSummary(dateStr = (state.attendance ? state.attendance.selectedDate : getTodayDateString()), classId = state.activeClassId) {
      const students = (state.classesCatalog && state.classesCatalog[classId] && state.classesCatalog[classId].students) || state.students || [];
      const total = Math.max(1, students.length);
      const dayRecords = getAttendanceForDate(dateStr, classId);
      let present = 0, absent = 0, late = 0;
      students.forEach(s => {
        const rec = dayRecords[s.id];
        const st = rec ? rec.status : 'present';
        if (st === 'present') present++;
        else if (st === 'absent') absent++;
        else if (st === 'late') late++;
      });
      const ratePct = Math.round(((present + (late * 0.5)) / total) * 100);

      const allDates = getSchoolDaysList();
      let sumDailyRates = 0, validDays = 0;
      allDates.forEach(d => {
        if (state.attendance && state.attendance.records && state.attendance.records[classId] && state.attendance.records[classId][d]) {
          const recs = state.attendance.records[classId][d];
          let dPres = 0, dLate = 0;
          students.forEach(s => {
            const r = recs[s.id];
            if (r && r.status === 'present') dPres++;
            else if (r && r.status === 'late') dLate++;
            else if (!r) dPres++;
          });
          sumDailyRates += ((dPres + (dLate * 0.5)) / total) * 100;
          validDays++;
        }
      });
      const monthRatePct = validDays > 0 ? Math.round(sumDailyRates / validDays) : ratePct;

      return {
        total,
        present,
        absent,
        late,
        ratePct,
        monthRatePct,
        isMarked: true
      };
    }

    function getStudentAttendanceSummary(studentId, classId = state.activeClassId) {
      const allDates = getSchoolDaysList().filter(d => state.attendance?.records?.[classId]?.[d]?.[studentId]);
      let totalDays = allDates.length;
      let presentDays = 0, absentDays = 0, lateDays = 0;
      const recentHistory = [];

      allDates.forEach(d => {
        const dayRecs = (state.attendance && state.attendance.records && state.attendance.records[classId] && state.attendance.records[classId][d]) || {};
        const rec = dayRecs[studentId] || { status: 'present' };
        if (rec.status === 'present') presentDays++;
        else if (rec.status === 'absent') absentDays++;
        else if (rec.status === 'late') lateDays++;
      });

      const last5 = allDates.slice(-5);
      last5.forEach(d => {
        const dayRecs = (state.attendance && state.attendance.records && state.attendance.records[classId] && state.attendance.records[classId][d]) || {};
        const rec = dayRecs[studentId] || { status: 'present' };
        recentHistory.push({ date: d, status: rec.status, reason: rec.reason || '' });
      });

      const ratePct = Math.round(((presentDays + (lateDays * 0.5)) / Math.max(1, totalDays)) * 100);
      return {
        totalDays,
        presentDays,
        absentDays,
        lateDays,
        ratePct,
        recentHistory
      };
    }

    function exportAttendanceCSV(classId = state.activeClassId) {
      const students = [...((state.classesCatalog && state.classesCatalog[classId] && state.classesCatalog[classId].students) || state.students || [])].sort((a,b) => a.roll - b.roll);
      const allDates = getSchoolDaysList();
      const rows = [];
      rows.push(['Roll', 'Student Name', 'Gender', 'Grade', 'Reading Level', 'Math Level', 'Date', 'Status', 'Absence Reason', '30-Day Rate Pct']);

      students.forEach(s => {
        const summ = getStudentAttendanceSummary(s.id, classId);
        allDates.forEach(d => {
          const dayRecs = (state.attendance.records && state.attendance.records[classId] && state.attendance.records[classId][d]) || {};
          const r = dayRecs[s.id] || { status: 'present', reason: '' };
          rows.push([
            s.roll,
            `"${s.name}"`,
            s.gender,
            s.grade || state.classInfo.grade,
            s.rCurr,
            s.mCurr,
            d,
            r.status.toUpperCase(),
            `"${r.reason || ''}"`,
            `${summ.ratePct}%`
          ]);
        });
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(',')).join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `Attendance_Register_${state.classInfo.className.replace(/\\s+/g, '_')}_${state.attendance.selectedDate}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Attendance register CSV exported successfully!', 'success');
    }

    function getDiagnosticItemsForCurrentFocus() {
      const subj = state.diagnostic.subject;
      const focus = state.diagnostic.focus;
      const bank = DIAGNOSTIC_ITEMS[subj] || DIAGNOSTIC_ITEMS.reading;
      return bank[focus] || bank.baseline;
    }

    function recordCompletedAssessmentEvidence(stu, competencyCode, scorePct, correctCount, totalQ, modeLabel) {
      if (!stu) return;
      const mapInfo = COMPETENCY_TO_TOPIC_MAP[competencyCode] || { subject: 'math', topicId: 'fractions', title: competencyCode };
      const isReading = mapInfo.subject === 'reading';

      if (!stu.topicScores) stu.topicScores = {};
      stu.topicScores[mapInfo.topicId] = scorePct;

      if (isReading) {
        stu.rAssessed = true;
        // Recompute overall reading score from topic scores
        const rTopics = ['letter_sounds', 'word_rec', 'sentence_reading', 'story_comp', 'grammar_basics'];
        const sumR = rTopics.reduce((acc, k) => acc + (typeof stu.topicScores[k] === 'number' ? stu.topicScores[k] : stu.rScore), 0);
        stu.rScore = Math.round(sumR / rTopics.length);
        stu.rCurr = stu.rScore >= 75 ? 'R3' : stu.rScore >= 45 ? 'R2' : 'R1';
      } else {
        stu.mAssessed = true;
        const mTopics = ['number_sense', 'add_no_carry', 'tens_ones', 'sub_no_borrow', 'sub_borrow', 'fractions'];
        const sumM = mTopics.reduce((acc, k) => acc + (typeof stu.topicScores[k] === 'number' ? stu.topicScores[k] : stu.mScore), 0);
        stu.mScore = Math.round(sumM / mTopics.length);
        stu.mCurr = stu.mScore >= 75 ? 'M3' : stu.mScore >= 45 ? 'M2' : 'M1';
      }

      stu.lastAssessed = 'Just now';
      const band = scorePct >= 78 ? 'Consistently Demonstrated' : scorePct >= 55 ? 'Developing' : scorePct >= 40 ? 'Emerging' : 'Follow-up Recommended';

      state.assessmentEvidenceLog.unshift({
        id: 'ev_' + Date.now(),
        studentName: stu.name,
        subject: isReading ? 'Reading' : 'Math',
        focus: `${competencyCode} · ${mapInfo.title} (${correctCount}/${totalQ})`,
        scorePct,
        status: band,
        date: 'Just now'
      });

      const prevAttemptsForComp = (state.assessBuilder.attemptsHistory || []).filter(
        a => a.studentId === stu.id && a.competencyCode === competencyCode
      ).length;

      const attemptRecord = {
        attemptId: 'att_' + Date.now(),
        attemptNumber: prevAttemptsForComp + 1,
        studentId: stu.id,
        studentName: stu.name,
        competencyCode,
        competencyTitle: mapInfo.title,
        questionCount: totalQ,
        correctCount,
        incorrectCount: totalQ - correctCount,
        unansweredCount: 0,
        scorePct,
        band,
        mode: modeLabel || 'Competency Assessment',
        timestamp: 'Just now'
      };
      if (!Array.isArray(state.assessBuilder.attemptsHistory)) state.assessBuilder.attemptsHistory = [];
      state.assessBuilder.attemptsHistory.unshift(attemptRecord);
      return attemptRecord;
    }

            <button data-assess-subtab="oral" class="assess-subtab-btn px-4 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'oral' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
              ⏱️ 2-Min Oral Check
            </button>
            <button data-assess-subtab="history" class="assess-subtab-btn px-4 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'history' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
              📋 Results &amp; History (${(ab.attemptsHistory || []).length + state.assessmentEvidenceLog.length})
            </button>
          </div>
        </div>
      `;

      // SUB-TAB 1: 7-STEP COMPETENCY ASSESSMENT BUILDER & FINITE ATTEMPT RUNNER
      if (subTab === 'builder' && !d.inSession) {
        const runner = ab.runner;
        const qList = ab.generatedQuestions || [];
        const totalQ = qList.length;

        let runnerSurfaceHtml = '';
        if (runner.status === 'in_progress' || runner.status === 'submitting') {
          const idx = Math.min(Math.max(0, runner.currentIndex), Math.max(0, totalQ - 1));
          const currQ = qList[idx] || qList[0];
          const pickedAns = runner.answers[idx];
          const answeredCount = Object.keys(runner.answers).length;
          const progressPct = Math.round(((idx + 1) / Math.max(1, totalQ)) * 100);
          const isLastQuestion = (idx === totalQ - 1);

          runnerSurfaceHtml = `
            <div class="glass-card rounded-3xl p-6 sm:p-8 border-2 border-blue-500/80 space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-extrabold bg-blue-600 text-white px-3 py-0.5 rounded-full">Question ${idx + 1} of ${totalQ}</span>
                    <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-200">${escapeHtml(currQ.competencyCode)} · ${escapeHtml(currQ.skillSubtag)}</span>
                    <span class="text-xs font-semibold text-slate-500 capitalize">Difficulty: ${escapeHtml(currQ.difficulty)}</span>
                  </div>
                  <div class="text-sm font-bold text-slate-700 mt-1">
                    Learner: <span class="text-slate-900 font-extrabold">#${targetStu.roll} ${escapeHtml(targetStu.name)}</span> · ${answeredCount} of ${totalQ} answered
                  </div>
                </div>
                <button id="cancelRunnerAttemptBtn" class="text-xs font-bold text-slate-500 hover:text-rose-600 px-3 py-1.5 rounded-full border border-slate-200">
                  ✕ Exit Attempt
                </button>
              </div>

              <!-- Progress Bar + Question Pill Navigator -->
              <div class="space-y-2">
                <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                  <div style="width: ${progressPct}%" class="h-full bg-blue-600 rounded-full transition-all duration-300"></div>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${qList.map((_, qIdx) => {
                    const isCurr = qIdx === idx;
                    const isAns = typeof runner.answers[qIdx] !== 'undefined';
                    return `
                      <button data-runner-jump="${qIdx}" class="runner-jump-pill w-7 h-7 rounded-full text-xs font-extrabold transition ${isCurr ? 'bg-blue-600 text-white ring-2 ring-blue-300' : isAns ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-slate-100 text-slate-600'}">
                        ${qIdx + 1}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Question Prompt (Bilingual) -->
              <div class="bg-slate-50/90 rounded-3xl p-6 border border-slate-200/80 space-y-3">
                <div class="text-base sm:text-lg font-extrabold text-slate-900 leading-snug">
                  ${escapeHtml(currQ.q)}
                </div>
                ${currQ.qHi ? `
                  <div class="text-xs sm:text-sm font-medium text-indigo-800">
                    🇮🇳 ${escapeHtml(currQ.qHi)}
                  </div>
                ` : ''}
              </div>

              <!-- Answer Choices -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${currQ.options.map(opt => {
                  const isSelected = pickedAns === opt;
                  return `
                    <button data-runner-option="${escapeHtml(opt)}" class="runner-option-btn text-left p-4 rounded-2xl border-2 font-extrabold text-sm transition flex items-center justify-between ${isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white hover:bg-blue-50/60 text-slate-900 border-slate-200'}">
                      <span>${escapeHtml(opt)}</span>
                      <span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'bg-white text-blue-600 border-white' : 'border-slate-300'}">${isSelected ? '✓' : ''}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              ${ab.releasePolicy === 'Immediate Feedback' && typeof pickedAns !== 'undefined' ? `
                <div class="rounded-2xl p-3.5 text-xs font-semibold border ${pickedAns === currQ.ans ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}">
                  ${pickedAns === currQ.ans ? '✅ Correct!' : `💡 Hint: ${escapeHtml(currQ.hint)}`} · ${escapeHtml(currQ.explanation)}
                </div>
              ` : ''}

              <!-- Finite Navigation Controls (No Infinite Loop!) -->
              <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100">
                <button id="runnerPrevQuestionBtn" ${idx === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-full text-xs font-extrabold border transition ${idx === 0 ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white hover:bg-slate-50 text-slate-800 border-slate-300'}">
                  ← Previous Question
                </button>
                <div class="flex items-center gap-2.5">
                  ${!isLastQuestion ? `
                    <button id="runnerNextQuestionBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs sm:text-sm px-6 py-2.5 rounded-full shadow-xs transition">
                      Next Question (${idx + 2}/${totalQ}) →
                    </button>
                  ` : `
                    <button id="runnerSubmitAssessmentBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm px-7 py-3 rounded-full shadow-md transition">
                      ✓ Submit Assessment &amp; View Results
                    </button>
                  `}
                </div>
              </div>
            </div>
          `;
        } else if (runner.status === 'results' && runner.lastResultSummary) {
          const res = runner.lastResultSummary;
          const mapInfo = COMPETENCY_TO_TOPIC_MAP[res.competencyCode] || { playground: 'fractions', title: res.competencyCode };
          runnerSurfaceHtml = `
            <div class="glass-card rounded-3xl p-6 sm:p-8 border-2 border-emerald-500/80 space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-extrabold uppercase bg-emerald-600 text-white px-3 py-0.5 rounded-full">✓ Assessment Completed (Attempt #${res.attemptNumber})</span>
                    <span class="text-xs font-bold bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-full border border-blue-200">${escapeHtml(res.competencyCode)}</span>
                  </div>
                  <h2 class="text-2xl font-extrabold text-slate-900 mt-1.5">
                    ${escapeHtml(res.studentName)} — ${res.scorePct}% (${res.correctCount}/${res.questionCount} Correct)
                  </h2>
                  <p class="text-xs text-slate-500 mt-0.5">
                    Competency: ${escapeHtml(res.competencyTitle)} · Mastery Band: <span class="font-bold text-slate-800">${escapeHtml(res.band)}</span>
                  </p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <button id="retakeFreshAssessmentBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-full shadow-xs transition">
                    🔄 Retake with New Question Set
                  </button>
                  <button id="resultsOpenWonderLabBtn" data-playground="${mapInfo.playground}" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-full shadow-xs transition">
                    ✨ Practice in WonderLab
                  </button>
                </div>
              </div>

              <!-- 4 KPI Breakdown Cards -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                <div class="bg-emerald-50/90 border border-emerald-200 rounded-2xl p-3.5">
                  <div class="text-2xl font-extrabold text-emerald-700">${res.correctCount}</div>
                  <div class="text-xs font-bold text-emerald-900">Correct Answers</div>
                </div>
                <div class="bg-rose-50/90 border border-rose-200 rounded-2xl p-3.5">
                  <div class="text-2xl font-extrabold text-rose-700">${res.incorrectCount}</div>
                  <div class="text-xs font-bold text-rose-900">Incorrect</div>
                </div>
                <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-3.5">
                  <div class="text-2xl font-extrabold text-amber-800">${res.unansweredCount}</div>
                  <div class="text-xs font-bold text-amber-900">Unanswered</div>
                </div>
                <div class="bg-indigo-50/90 border border-indigo-200 rounded-2xl p-3.5">
                  <div class="text-lg font-extrabold text-indigo-800">${escapeHtml(res.band)}</div>
                  <div class="text-xs font-bold text-indigo-900">Performance Interpretation</div>
                </div>
              </div>

              <!-- Skills Demonstrated vs Skills Needing Practice -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div class="bg-emerald-50/60 border border-emerald-200/80 rounded-2xl p-4 space-y-1.5">
                  <div class="font-extrabold text-emerald-900">🌟 Skills Demonstrated</div>
                  <p class="text-slate-700">${escapeHtml(res.skillsDemonstrated.length > 0 ? res.skillsDemonstrated.join(' · ') : 'Completed full assessment sequence; foundational readiness recorded.')}</p>
                </div>
                <div class="bg-amber-50/60 border border-amber-200/80 rounded-2xl p-4 space-y-1.5">
                  <div class="font-extrabold text-amber-900">🎯 Recommended Next Steps &amp; Practice Focus</div>
                  <p class="text-slate-700">${escapeHtml(res.skillsNeedingPractice.length > 0 ? `Focus on: ${res.skillsNeedingPractice.join(' · ')}. Launch the interactive ${mapInfo.playground.toUpperCase()} playground in WonderLab.` : `Ready for stretch problems and peer group leadership!`)}</p>
                </div>
              </div>

              <!-- Question-by-Question Review -->
              ${ab.releasePolicy !== 'Teacher Review Only' || state.auth.role === 'teacher' ? `
                <div class="space-y-2.5 pt-2 border-t border-slate-100">
                  <div class="text-xs font-extrabold text-slate-800 uppercase">Question-by-Question Evidence Review</div>
                  <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    ${res.questionReview.map((qr, i) => `
                      <div class="rounded-2xl p-3.5 border text-xs ${qr.isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'} space-y-1">
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-extrabold text-slate-900">Q${i + 1} (${escapeHtml(qr.skillSubtag)}): ${escapeHtml(qr.q)}</span>
                          <span class="font-extrabold px-2 py-0.5 rounded-full ${qr.isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${qr.isCorrect ? '✓ Correct' : '✗ Incorrect'}</span>
                        </div>
                        <div class="text-slate-700">
                          Learner Answer: <span class="font-bold">${escapeHtml(qr.picked || 'Unanswered')}</span> · Verified Correct Answer: <span class="font-bold text-emerald-800">${escapeHtml(qr.ans)}</span>
                        </div>
                        <div class="text-slate-500 italic">Explanation: ${escapeHtml(qr.explanation)}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }

        return `
          <div class="space-y-6">
            ${topSubNavHtml}
            ${runnerSurfaceHtml}

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <!-- Left 5 Cols: 7-Step Assessment Configuration & Assignment -->
              <div class="lg:col-span-5 glass-card rounded-3xl p-6 space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <span class="text-[11px] font-extrabold text-blue-600 uppercase">Steps 1–3 · Configure &amp; Generate</span>
                    <h2 class="text-base font-extrabold text-slate-900">Competency Assessment Builder</h2>
                  </div>
                  <span class="text-[11px] font-bold bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-full border border-blue-200">Seed #${ab.attemptSeed}</span>
                </div>

                <!-- Step 1: Select Competency -->
                <div class="space-y-1.5">
                  <label class="block text-xs font-extrabold text-slate-700">1. Select Target NIPUN Competency (100% Pure Alignment)</label>
                  <select id="abCompetencySelect" class="w-full rounded-2xl bg-slate-50 border border-slate-200 px-3.5 py-2.5 text-xs font-extrabold text-slate-900">
                    ${allComps.map(c => `
                      <option value="${c.code}" ${c.code === ab.competencyCode ? 'selected' : ''}>
                        ${escapeHtml(c.code)} (${escapeHtml(c.grade)}) · ${escapeHtml(c.title)}
                      </option>
                    `).join('')}
                  </select>
                  <div class="text-[11px] text-slate-500">
                    Outcome: ${escapeHtml(activeComp.outcome)}
                  </div>
                </div>

                <!-- Step 2: Select Finite Question Count (5, 10, 15, 20, or Custom) -->
                <div class="space-y-2">
                  <label class="block text-xs font-extrabold text-slate-700">2. Number of Questions (Finite Assessment Length)</label>
                  <div class="grid grid-cols-4 gap-2">
                    ${[
                      { n: 5, lbl: 'Quick (5)' },
                      { n: 10, lbl: 'Standard (10)' },
                      { n: 15, lbl: 'Detailed (15)' },
                      { n: 20, lbl: 'Extended (20)' }
                    ].map(preset => `
                      <button data-ab-qcount="${preset.n}" class="ab-qcount-btn py-2 px-2 rounded-xl text-xs font-extrabold border transition ${ab.questionCount === preset.n ? 'bg-blue-600 text-white border-blue-600 shadow-2xs' : 'bg-slate-50 hover:bg-white text-slate-700 border-slate-200'}">
                        ${preset.lbl}
                      </button>
                    `).join('')}
                  </div>
                  <div class="flex items-center gap-2 pt-1">
                    <span class="text-[11px] font-semibold text-slate-500">Or custom count (3–25):</span>
                    <input id="abCustomQCountInput" type="number" min="3" max="25" value="${ab.questionCount}" class="w-20 rounded-xl bg-slate-50 border border-slate-200 px-2.5 py-1 text-xs font-extrabold text-slate-900" />
                  </div>
                </div>

                <!-- Step 3: Difficulty & Answer Release Policy -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Difficulty Profile</label>
                    <select id="abDifficultySelect" class="w-full rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-xs font-bold text-slate-800">
                      <option value="Balanced Progression" ${ab.difficultyMode === 'Balanced Progression' ? 'selected' : ''}>Balanced Progression</option>
                      <option value="Foundational Support" ${ab.difficultyMode === 'Foundational Support' ? 'selected' : ''}>Foundational Support</option>
                      <option value="Stretch & Application" ${ab.difficultyMode === 'Stretch & Application' ? 'selected' : ''}>Stretch &amp; Application</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Answer-Key Release</label>
                    <select id="abReleasePolicySelect" class="w-full rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-xs font-bold text-slate-800">
                      <option value="After Submission" ${ab.releasePolicy === 'After Submission' ? 'selected' : ''}>After Submission</option>
                      <option value="Immediate Feedback" ${ab.releasePolicy === 'Immediate Feedback' ? 'selected' : ''}>Immediate Feedback</option>
                      <option value="Teacher Review Only" ${ab.releasePolicy === 'Teacher Review Only' ? 'selected' : ''}>Teacher Review Only</option>
                    </select>
                  </div>
                </div>

                <!-- Step 4: Target Learner or Skill Group -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-slate-100">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Target Learner</label>
                    <select id="abTargetStudentSelect" class="w-full rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-xs font-bold text-slate-800">
                      ${state.students.map(s => `
                        <option value="${s.id}" ${s.id === Number(ab.targetStudentId) ? 'selected' : ''}>
                          #${s.roll} ${escapeHtml(s.name)} (${s.rCurr}/${s.mCurr}${s.rAssessed === false ? ' · ⏳' : ''})
                        </option>
                      `).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Assign to Skill Group</label>
                    <select id="abTargetGroupSelect" class="w-full rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-xs font-bold text-slate-800">
                      <option value="R1 · Sparrows">R1 · Sparrows</option>
                      <option value="R2 · Robins">R2 · Robins</option>
                      <option value="R3 · Owls">R3 · Owls</option>
                      <option value="M1 · Tigers">M1 · Tigers</option>
                      <option value="M2 · Elephants">M2 · Elephants</option>
                      <option value="M3 · Eagles" selected>M3 · Eagles</option>
                    </select>
                  </div>
                </div>

                <div class="flex flex-wrap gap-2 pt-2">
                  <button id="abRegenerateFullSetBtn" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold px-4 py-2.5 rounded-full transition">
                    🔄 Generate Fresh Non-Repeating Set (${ab.questionCount} Qs)
                  </button>
                  <button id="abStartFiniteAttemptBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-5 py-2.5 rounded-full shadow-sm transition">

                  </button>
                  <button id="abAssignToGroupBtn" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-extrabold px-4 py-2 rounded-full transition">
                    + Assign to Group

                </div>
              </div>

              <!-- Right 7 Cols: Teacher Question-Set Preview & Item Controls -->
              <div class="lg:col-span-7 glass-card rounded-3xl p-6 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">

                    <span class="text-[11px] font-extrabold text-emerald-700 uppercase">
                      ✓ Validated Question Bank · 100% ${escapeHtml(ab.competencyCode)} Aligned · 0 Duplicates
                    </span>
                    <h2 class="text-base font-extrabold text-slate-900">
                      Teacher Preview &amp; Item Inspector (${totalQ} Questions)

                  </div>
                  <span class="text-xs font-bold text-slate-500">Reorder, replace, or regenerate individual items</span>

                <div class="space-y-3 max-h-[540px] overflow-y-auto pr-1">
                  ${qList.map((qItem, idx) => `
                    <div class="bg-slate-50/90 rounded-2xl p-4 border border-slate-200/80 space-y-2">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">

                          <span class="text-[11px] font-semibold text-slate-500">${escapeHtml(qItem.skillSubtag)}</span>
                          <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">${escapeHtml(qItem.difficulty)}</span>

                        <div class="flex items-center gap-1">
                          <button data-ab-move-up="${idx}" title="Move Question Up" class="ab-move-up-btn px-2 py-1 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700">↑</button>
                          <button data-ab-move-down="${idx}" title="Move Question Down" class="ab-move-down-btn px-2 py-1 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700">↓</button>
                          <button data-ab-regen-single="${idx}" title="Regenerate this question with a new unseen variant" class="ab-regen-single-btn px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-[11px] font-bold text-indigo-800">🔄 Swap Item</button>
                        </div>
                      </div>

                      <div class="text-xs sm:text-sm font-extrabold text-slate-900">
                        ${escapeHtml(qItem.q)}
                      </div>
                      <div class="flex flex-wrap gap-1.5 text-xs">
                        ${qItem.options.map(opt => `
                          <span class="px-2.5 py-1 rounded-xl border ${opt === qItem.ans ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-extrabold' : 'bg-white border-slate-200 text-slate-600'}">
                            ${opt === qItem.ans ? '✓ ' : ''}${escapeHtml(opt)}
                          </span>
                        `).join('')}
                      </div>
                      <div class="text-[11px] text-slate-500">
                        <span class="font-semibold text-slate-700">Explanation:</span> ${escapeHtml(qItem.explanation)}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // SUB-TAB 3: ASSESSMENT RESULTS & STUDENT PERFORMANCE HISTORY
      if (subTab === 'history' && !d.inSession) {
        return `
          <div class="space-y-6">
            ${topSubNavHtml}
            <div class="glass-card rounded-3xl p-6 space-y-4">
              <div class="flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-extrabold text-slate-900">Completed Competency Assessment Attempts</h2>
                  <p class="text-xs text-slate-500">Every completed finite quiz attempt and oral check automatically updates class &amp; student analytics</p>
                </div>
                <span class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-full">${(ab.attemptsHistory || []).length} structured attempts</span>
              </div>

              <div class="space-y-2.5">
                ${(ab.attemptsHistory || []).map(att => `
                  <div class="bg-slate-50/90 rounded-2xl p-4 border border-slate-200/80 flex flex-wrap items-center justify-between gap-3 text-xs">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="font-extrabold text-sm text-slate-900">${escapeHtml(att.studentName)}</span>
                        <span class="font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-200">${escapeHtml(att.competencyCode)}</span>
                        <span class="text-slate-500">Attempt #${att.attemptNumber} · ${att.questionCount} Questions</span>
                      </div>
                      <div class="text-slate-500 mt-0.5">${escapeHtml(att.competencyTitle)} · ${escapeHtml(att.timestamp)}</div>

      // Active 2-Minute Oral Session View
      const item = items[d.currentItemIndex] || items[0];
      const mins = Math.floor(d.elapsedSeconds / 60);

            <div class="flex items-center gap-3">

                Correct (Demonstrated)
              </button>
              <button data-score="partial" class="diag-score-btn py-4 px-4 rounded-2xl bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold text-sm sm:text-base border border-amber-200/80 transition active:scale-98">
                Partial (Developing)
              </button>
              <button data-score="incorrect" class="diag-score-btn py-4 px-4 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-800 font-bold text-sm sm:text-base border border-rose-200/80 transition active:scale-98">

              </button>
            </div>
