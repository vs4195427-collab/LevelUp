      `;
    }

    function startDiagnosticTimer() {
      stopDiagnosticTimer();
      diagTimerInterval = setInterval(() => {
        if (!state.diagnostic.inSession || state.activeTab !== 'diagnostic') {
          stopDiagnosticTimer();
          return;
        }
        state.diagnostic.elapsedSeconds += 1;
        const el = document.getElementById('diagTimerDisplay');
        if (el) {
          const mins = Math.floor(state.diagnostic.elapsedSeconds / 60);
          const secs = String(state.diagnostic.elapsedSeconds % 60).padStart(2, '0');
          el.textContent = `${mins}:${secs}`;
        }
      }, 1000);
    }

    function stopDiagnosticTimer() {
      if (diagTimerInterval) {
        clearInterval(diagTimerInterval);
        diagTimerInterval = null;
      }
    }

    function finalizeFiniteAssessmentAttempt() {
      const ab = state.assessBuilder;
      const runner = ab.runner;
      if (runner.status === 'submitting' || runner.status === 'results') return;
      runner.status = 'submitting';

      const qList = ab.generatedQuestions || [];
      const totalQ = Math.max(1, qList.length);
      let correctCount = 0;
      let incorrectCount = 0;
      let unansweredCount = 0;
      const demonstratedSet = new Set();
      const practiceSet = new Set();
      const targetStu = state.students.find(s => s.id === Number(ab.targetStudentId)) || state.students[0];

      const questionReview = qList.map((qItem, idx) => {
        const picked = runner.answers[idx];
        const isCorrect = picked === qItem.ans;
        if (typeof picked === 'undefined') {
          unansweredCount++;
          practiceSet.add(qItem.skillSubtag);
        } else if (isCorrect) {
          correctCount++;
          demonstratedSet.add(qItem.skillSubtag);
        } else {
          incorrectCount++;
          practiceSet.add(qItem.skillSubtag);
        }
        if (targetStu && Array.isArray(targetStu.seenQuestionSignatures) && !targetStu.seenQuestionSignatures.includes(qItem.canonicalSignature)) {
          targetStu.seenQuestionSignatures.push(qItem.canonicalSignature);
        }
        return {
          q: qItem.q,
          skillSubtag: qItem.skillSubtag,
          picked,
          ans: qItem.ans,
          isCorrect,
          explanation: qItem.explanation
        };
      });

      const scorePct = Math.round((correctCount / totalQ) * 100);
      const attemptRec = recordCompletedAssessmentEvidence(
        targetStu,
        ab.competencyCode,
        scorePct,
        correctCount,
        totalQ,
        `${totalQ}-Question Competency Assessment`
      );

      runner.lastResultSummary = Object.assign({}, attemptRec, {
        unansweredCount,
        skillsDemonstrated: Array.from(demonstratedSet),
        skillsNeedingPractice: Array.from(practiceSet),
        questionReview
      });
      runner.status = 'results';
      saveState();
      showToast(`Assessment complete! ${targetStu.name} scored ${scorePct}% (${correctCount}/${totalQ}). Class analytics updated!`, 'success');
      renderApp();
    }

    function bindDiagnosticEvents() {
      const d = state.diagnostic;
      const ab = state.assessBuilder;

      document.querySelectorAll('.assess-subtab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.assessSubTab = btn.getAttribute('data-assess-subtab');
          d.inSession = false;
          stopDiagnosticTimer();
          saveState();
          renderApp();
        });
      });

      // Bind 7-Step Assessment Builder Events
      const compSel = document.getElementById('abCompetencySelect');
      if (compSel) {
        compSel.addEventListener('change', (e) => {
          ab.competencyCode = e.target.value;
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          ab.runner.status = 'not_started';
          saveState();
          showToast(`Generated ${ab.questionCount} validated questions for ${ab.competencyCode}.`, 'success');
          renderApp();
        });
      }

      document.querySelectorAll('.ab-qcount-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          ab.questionCount = Number(btn.getAttribute('data-ab-qcount')) || 5;
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          ab.runner.status = 'not_started';
          saveState();
          renderApp();
        });
      });

      const customCntIn = document.getElementById('abCustomQCountInput');
      if (customCntIn) {
        customCntIn.addEventListener('change', (e) => {
          const val = Math.max(3, Math.min(25, Number(e.target.value) || 5));
          ab.questionCount = val;
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          ab.runner.status = 'not_started';
          saveState();
          renderApp();
        });
      }

      const diffSel = document.getElementById('abDifficultySelect');
      if (diffSel) {
        diffSel.addEventListener('change', (e) => {
          ab.difficultyMode = e.target.value;
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          saveState();
          renderApp();
        });
      }

      const relSel = document.getElementById('abReleasePolicySelect');
      if (relSel) {
        relSel.addEventListener('change', (e) => {
          ab.releasePolicy = e.target.value;
          saveState();
          renderApp();
        });
      }

      const stuTargetSel = document.getElementById('abTargetStudentSelect');
      if (stuTargetSel) {
        stuTargetSel.addEventListener('change', (e) => {
          ab.targetStudentId = Number(e.target.value);
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          saveState();
          renderApp();
        });
      }

      const regenFullBtn = document.getElementById('abRegenerateFullSetBtn');
      if (regenFullBtn) {
        regenFullBtn.addEventListener('click', () => {
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          ab.runner.status = 'not_started';
          saveState();
          showToast(`Generated a fresh non-repeating ${ab.questionCount}-question set for ${ab.competencyCode}!`, 'success');
          renderApp();
        });
      }

      const launchAttemptBtn = document.getElementById('abStartFiniteAttemptBtn');
      if (launchAttemptBtn) {
        launchAttemptBtn.addEventListener('click', () => {
          ab.runner.status = 'in_progress';
          ab.runner.currentIndex = 0;
          ab.runner.answers = {};
          ab.runner.startedAt = Date.now();
          saveState();
          renderApp();
        });
      }

      const assignGrpBtn = document.getElementById('abAssignToGroupBtn');
      if (assignGrpBtn) {
        assignGrpBtn.addEventListener('click', () => {
          const grpEl = document.getElementById('abTargetGroupSelect');
          const grp = grpEl ? grpEl.value : 'M3 · Eagles';
          state.wonderlab.assignments.unshift({
            id: 'wl_' + Date.now(),
            title: `${ab.competencyCode} Assessment (${ab.questionCount} Qs)`,
            competencyCode: ab.competencyCode,
            questionCount: ab.questionCount,
            group: grp,
            assignedCount: 8,
            status: 'Active'
          });
          saveState();
          showToast(`Assigned ${ab.questionCount}-question ${ab.competencyCode} assessment to ${grp}!`, 'success');
        });
      }

      // Per-question item controls (Move Up, Move Down, Swap Single Item)
      document.querySelectorAll('.ab-move-up-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-ab-move-up'));
          if (idx > 0) {
            const tmp = ab.generatedQuestions[idx - 1];
            ab.generatedQuestions[idx - 1] = ab.generatedQuestions[idx];
            ab.generatedQuestions[idx] = tmp;
            saveState();
            renderApp();
          }
        });
      });

      document.querySelectorAll('.ab-move-down-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-ab-move-down'));
          if (idx < ab.generatedQuestions.length - 1) {
            const tmp = ab.generatedQuestions[idx + 1];
            ab.generatedQuestions[idx + 1] = ab.generatedQuestions[idx];
            ab.generatedQuestions[idx] = tmp;
            saveState();
            renderApp();
          }
        });
      });

      document.querySelectorAll('.ab-regen-single-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-ab-regen-single'));
          const existingSigs = new Set(ab.generatedQuestions.map(q => q.canonicalSignature));
          const pool = buildCompetencyCandidatePool(ab.competencyCode);
          const replacement = pool.find(cand => !existingSigs.has(cand.canonicalSignature));
          if (replacement) {
            ab.generatedQuestions[idx] = replacement;
            saveState();
            showToast(`Replaced Q${idx + 1} with a new verified ${ab.competencyCode} item.`, 'success');
            renderApp();
          } else {
            showToast('All unique templates in this competency pool are currently in view.');
          }
        });
      });

      // Runner controls (Select option, Jump pill, Prev, Next, Submit, Exit, Retake)
      document.querySelectorAll('.runner-option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const opt = btn.getAttribute('data-runner-option');
          ab.runner.answers[ab.runner.currentIndex] = opt;
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.runner-jump-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          ab.runner.currentIndex = Number(btn.getAttribute('data-runner-jump')) || 0;
          saveState();
          renderApp();
        });
      });

      const prevQBtn = document.getElementById('runnerPrevQuestionBtn');
      if (prevQBtn) {
        prevQBtn.addEventListener('click', () => {
          if (ab.runner.currentIndex > 0) {
            ab.runner.currentIndex -= 1;
            saveState();
            renderApp();
          }
        });
      }

      const nextQBtn = document.getElementById('runnerNextQuestionBtn');
      if (nextQBtn) {
        nextQBtn.addEventListener('click', () => {
          if (ab.runner.currentIndex + 1 < ab.generatedQuestions.length) {
            ab.runner.currentIndex += 1;
            saveState();
            renderApp();
          }
        });
      }

      const submitAssBtn = document.getElementById('runnerSubmitAssessmentBtn');
      if (submitAssBtn) {
        submitAssBtn.addEventListener('click', () => {
          finalizeFiniteAssessmentAttempt();
        });
      }

      const cancelRunBtn = document.getElementById('cancelRunnerAttemptBtn');
      if (cancelRunBtn) {
        cancelRunBtn.addEventListener('click', () => {
          ab.runner.status = 'not_started';
          saveState();
          renderApp();
        });
      }

      const retakeBtn = document.getElementById('retakeFreshAssessmentBtn');
      if (retakeBtn) {
        retakeBtn.addEventListener('click', () => {
          ab.attemptSeed += 1;
          ab.generatedQuestions = generateCompetencyQuestionSet(ab.competencyCode, ab.questionCount, ab.difficultyMode, ab.targetStudentId, ab.attemptSeed);
          ab.runner.status = 'in_progress';
          ab.runner.currentIndex = 0;
          ab.runner.answers = {};
          saveState();
          showToast('Started new attempt with a fresh, non-repeating question set!', 'success');
          renderApp();
        });
      }

      const resWlBtn = document.getElementById('resultsOpenWonderLabBtn');
      if (resWlBtn) {
        resWlBtn.addEventListener('click', () => {
          state.wonderlab.activePlayground = resWlBtn.getAttribute('data-playground') || 'fractions';
          state.wonderlab.competencyCode = ab.competencyCode;
          switchTab('wonderlab');
        });
      }

      // Bind 2-Minute Oral Check Events
      if (!d.inSession) {
        document.querySelectorAll('.diag-subj-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            d.subject = btn.getAttribute('data-diag-subj');
            d.focus = 'baseline';
            saveState();
            renderApp();
          });
        });

        document.querySelectorAll('.diag-focus-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            d.focus = btn.getAttribute('data-diag-focus');
            saveState();
            renderApp();
          });
        });

        const stuSelect = document.getElementById('diagStudentSelect');
        if (stuSelect) {
          stuSelect.addEventListener('change', (e) => {
            d.selectedStudentIndex = Number(e.target.value) || 0;
            saveState();
            renderApp();
          });
        }

        const startBtn = document.getElementById('startDiagSessionBtn');
        if (startBtn) {
          startBtn.addEventListener('click', () => {
            d.inSession = true;
            d.currentItemIndex = 0;
            d.sessionScores = [];
            d.elapsedSeconds = 0;
            saveState();
            renderApp();
            startDiagnosticTimer();
          });
        }
      } else {
        startDiagnosticTimer();

        document.querySelectorAll('.diag-score-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const score = btn.getAttribute('data-score');
            d.sessionScores.push(score);
            const items = getDiagnosticItemsForCurrentFocus();

            if (d.currentItemIndex + 1 < items.length) {
              d.currentItemIndex += 1;
              saveState();
              renderApp();
            } else {
              finalizeStudentDiagnostic();
            }
          });
        });

        const skipBtn = document.getElementById('diagSkipStudentBtn');
        if (skipBtn) {
          skipBtn.addEventListener('click', () => {
            const currStu = state.students[d.selectedStudentIndex];
            d.selectedStudentIndex = (d.selectedStudentIndex + 1) % state.students.length;
            d.currentItemIndex = 0;
            d.sessionScores = [];
            d.elapsedSeconds = 0;
            saveState();
            showToast(`Skipped ${currStu ? currStu.name : 'student'}. Moved to next child.`);
            renderApp();
          });
        }

        const finishBtn = document.getElementById('diagFinishClassBtn');
        if (finishBtn) {
          finishBtn.addEventListener('click', () => {
            stopDiagnosticTimer();
            d.inSession = false;
            d.currentItemIndex = 0;
            d.sessionScores = [];
            saveState();
            showToast('Assessment session saved. Class analytics & groups updated!', 'success');
            renderApp();
          });
        }
      }
    }

    function finalizeStudentDiagnostic() {
      const d = state.diagnostic;
      const stu = state.students[d.selectedStudentIndex];
      if (!stu) return;

      const total = Math.max(1, d.sessionScores.length);
      let points = 0;
      d.sessionScores.forEach(sc => {
        if (sc === 'correct') points += 1;
        else if (sc === 'partial') points += 0.5;
      });
      const pct = Math.round((points / total) * 100);
      const statusLabel = pct >= 78 ? 'Consistently Demonstrated' : pct >= 55 ? 'Developing' : pct >= 40 ? 'Emerging' : 'Follow-up Recommended';

      if (d.subject === 'reading') {
        stu.rScore = pct;
        stu.rAssessed = true;
        if (d.focus !== 'baseline' && stu.topicScores) {
          stu.topicScores[d.focus] = pct;
        }
        const newLevel = pct >= 75 ? 'R3' : pct >= 45 ? 'R2' : 'R1';
        stu.rCurr = newLevel;
        stu.lastAssessed = 'Just now';
        showToast(`${stu.name}: ${pct}% (${statusLabel}) → Group ${newLevel}.`, 'success');
      } else {
        stu.mScore = pct;
        stu.mAssessed = true;
        if (d.focus !== 'baseline' && stu.topicScores) {
          stu.topicScores[d.focus] = pct;
        }
        const newLevel = pct >= 75 ? 'M3' : pct >= 45 ? 'M2' : 'M1';
        stu.mCurr = newLevel;
        stu.lastAssessed = 'Just now';
        showToast(`${stu.name}: ${pct}% (${statusLabel}) → Group ${newLevel}.`, 'success');
      }

      state.assessmentEvidenceLog.unshift({
        id: 'ev_' + Date.now(),
        studentName: stu.name,
        subject: d.subject === 'reading' ? 'Reading' : 'Math',
        focus: d.focus,
        scorePct: pct,
        status: statusLabel,
        date: 'Just now'
      });

      d.selectedStudentIndex = (d.selectedStudentIndex + 1) % state.students.length;
      d.currentItemIndex = 0;
      d.sessionScores = [];
      d.elapsedSeconds = 0;
      saveState();
      renderApp();
    }

    function bindSheetsEvents() {
      document.querySelectorAll('.sheet-subj-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const newSubj = btn.getAttribute('data-sheet-subj');
          state.sheets.subject = newSubj;
          state.sheets.selectedSheetId = newSubj === 'reading' ? 'r1_letter_sounds' : 'm1_bigger_smaller';
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.select-sheet-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.sheets.selectedSheetId = btn.getAttribute('data-select-sheet');
          saveState();
          renderApp();
        });
      });

      const bwBtn = document.getElementById('toggleBwSheetModeBtn');
      if (bwBtn) {
        bwBtn.addEventListener('click', () => {
          state.sheets.bwMode = !state.sheets.bwMode;
          saveState();
          renderApp();
        });
      }

      document.querySelectorAll('.toggle-assign-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = Number(btn.getAttribute('data-toggle-assign'));
          const idx = state.sheets.selectedStudentIds.indexOf(sid);
          if (idx >= 0) {
            state.sheets.selectedStudentIds.splice(idx, 1);
          } else {
            state.sheets.selectedStudentIds.push(sid);
          }
          saveState();
          renderApp();
        });
      });

      const selectGroupBtn = document.getElementById('selectGroupStudentsBtn');
      if (selectGroupBtn) {
        selectGroupBtn.addEventListener('click', () => {
          const activeSheet = findSheetById(state.sheets.subject, state.sheets.selectedSheetId);
          if (!activeSheet) return;
          const groupCode = activeSheet.groupBadge;
          const matchingIds = state.students
            .filter(s => (state.sheets.subject === 'reading' ? s.rCurr : s.mCurr) === groupCode)
            .map(s => s.id);
          state.sheets.selectedStudentIds = matchingIds;
          saveState();
          showToast(`Selected all ${matchingIds.length} students in Group ${groupCode}.`);
          renderApp();
        });
      }

      const logBtn = document.getElementById('logSheetAssignmentBtn');
      if (logBtn) {
        logBtn.addEventListener('click', () => {
          const count = state.sheets.selectedStudentIds.length;
          if (count === 0) {
            showToast('Select at least one student to log the practice sheet.');
            return;
          }
          const activeSheet = findSheetById(state.sheets.subject, state.sheets.selectedSheetId);
          state.loggedPracticeCount += count;
          state.assignmentLog.unshift({
            sheetTitle: activeSheet ? `${activeSheet.title} (${activeSheet.qrCode})` : 'Practice Sheet',
            count,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          saveState();
          showToast(`Logged "${activeSheet ? activeSheet.title : 'Practice Sheet'}" for ${count} student${count > 1 ? 's' : ''}!`, 'success');
        });
      }

      const printBtn = document.getElementById('printSheetWindowBtn');
      if (printBtn) {
        printBtn.addEventListener('click', () => {
          const activeSheet = findSheetById(state.sheets.subject, state.sheets.selectedSheetId);
          const code = activeSheet ? activeSheet.qrCode : 'Worksheet';
          exportElementToPdfOrPrint('printableWorksheetSurface', `LevelUp_${code}.pdf`);
        });
      }
    }

    function renderSubjectReportSection(subjectKey, title) {
      const dyn = computeDynamicClassAnalytics(subjectKey);
      const total = Math.max(1, dyn.totalStudents);
      const topics = computeDynamicTopicStats(subjectKey);
      const weeksData = dyn.weeksData;
      const wk1 = weeksData[0];
      const wk4 = weeksData[3];

      const p1Start = Math.round((wk1.l1 / total) * 100);
      const p2Start = Math.round((wk1.l2 / total) * 100);
      const p3Start = Math.round((wk1.l3 / total) * 100);

      const assessedDenom = Math.max(1, dyn.assessedCount);
      const p1Now = Math.round((wk4.l1 / assessedDenom) * 100);
      const p2Now = Math.round((wk4.l2 / assessedDenom) * 100);
      const p3Now = Math.round((wk4.l3 / assessedDenom) * 100);

      // Compute top improved students dynamically from actual score gains
      const topImproved = [...state.students]
        .filter(s => subjectKey === 'reading' ? s.rAssessed !== false : s.mAssessed !== false)
        .map(s => {
          const curr = subjectKey === 'reading' ? s.rScore : s.mScore;
          const base = subjectKey === 'reading' ? (s.rBaseScore || Math.max(20, curr - 16)) : (s.mBaseScore || Math.max(20, curr - 15));
          return { name: s.name, gainPts: Math.max(2, curr - base) };

          <div class="bg-emerald-50/90 border border-emerald-200/70 rounded-2xl px-5 py-3.5 text-emerald-800 font-bold text-sm flex flex-wrap items-center justify-between gap-2">

          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-50/70 rounded-3xl p-6 border border-slate-200/70 space-y-5">

                <table class="w-full text-left text-xs sm:text-sm">

                    <tr class="text-slate-400 border-b border-slate-200/80">
                      <th class="pb-2 font-medium">Level</th>
                      <th class="pb-2 font-medium">Wk 1 Baseline (N=${total})</th>
                      <th class="pb-2 font-medium">Wk 4 Assessed (N=${dyn.assessedCount})</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200/60 font-medium text-slate-800">
                    <tr>
                      <td class="py-2.5 font-bold">Level 1</td>
                      <td class="py-2.5">${wk1.l1} (${p1Start}%)</td>
                      <td class="py-2.5 font-bold">${wk4.l1} (${p1Now}%)</td>
                    </tr>
                    <tr>
                      <td class="py-2.5 font-bold">Level 2</td>
                      <td class="py-2.5">${wk1.l2} (${p2Start}%)</td>

                    <tr>
                      <td class="py-2.5 font-bold">Level 3</td>

                ${topImproved.map(t => `

          </div>
        </div>
      `;

    function renderIndividualStudentTrackSection(stu) {
      const st = getCompetencyStatusForStudent(stu);
      const rWk1 = stu.rBaseScore || Math.max(20, stu.rScore - 18);
      const rWk2 = Math.max(25, Math.round((rWk1 * 2 + stu.rScore) / 3));
      const rWk3 = Math.max(30, Math.round((rWk1 + stu.rScore * 2) / 3));
      const rWk4 = stu.rScore;

      const mWk1 = stu.mBaseScore || Math.max(20, stu.mScore - 16);
      const mWk2 = Math.max(25, Math.round((mWk1 * 2 + stu.mScore) / 3));
      const mWk3 = Math.max(30, Math.round((mWk1 + stu.mScore * 2) / 3));
      const mWk4 = stu.mScore;

      const rHist = stu.rHistory || [stu.rBase, stu.rBase, stu.rCurr];
      const mHist = stu.mHistory || [stu.mBase, stu.mBase, stu.mCurr];

      const weeks = [
        { label: 'Week 1 (Baseline)', r: rWk1, m: mWk1, rLvl: rHist[0], mLvl: mHist[0] },
        { label: 'Week 2', r: rWk2, m: mWk2, rLvl: rHist[1], mLvl: mHist[1] },
        { label: 'Week 3', r: rWk3, m: mWk3, rLvl: rHist[2], mLvl: mHist[2] },
        { label: 'Week 4 (Current)', r: rWk4, m: mWk4, rLvl: stu.rCurr, mLvl: stu.mCurr }

      const readingBreakdowns = TOPICS.reading.map((t, idx) => {

        const status = score >= 75 ? 'Demonstrated' : score >= 55 ? 'Developing' : 'Emerging';

        const status = score >= 75 ? 'Demonstrated' : score >= 55 ? 'Developing' : 'Emerging';
        return { ...t, stuScore: score, stuStatus: status };

    function renderChapatiSvg(denom, num, size = 140) {
      const r = 56;
      const cx = 64, cy = 64;
      let paths = '';
      if (denom === 1) {
        paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${num >= 1 ? '#f59e0b' : '#fef3c7'}" stroke="#92400e" stroke-width="2.5"/>`;
      } else {
        for (let i = 0; i < denom; i++) {
          const startAngle = (i * 2 * Math.PI) / denom - Math.PI / 2;
          const endAngle = ((i + 1) * 2 * Math.PI) / denom - Math.PI / 2;
          const x1 = (cx + r * Math.cos(startAngle)).toFixed(2);
          const y1 = (cy + r * Math.sin(startAngle)).toFixed(2);
          const x2 = (cx + r * Math.cos(endAngle)).toFixed(2);
          const y2 = (cy + r * Math.sin(endAngle)).toFixed(2);
          const largeArc = denom === 1 ? 1 : 0;
          const fillClr = i < num ? '#f59e0b' : '#fffbeb';
          paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${fillClr}" stroke="#92400e" stroke-width="2"/>`;
        }
      }
      return `<svg viewBox="0 0 128 128" width="${size}" height="${size}" class="mx-auto drop-shadow-2xs">${paths}</svg>`;
    }

          { word: 'SCHOOL', hi: 'विद्यालय (School)', parts: ['S', 'C', 'H', 'O', 'O', 'L'], sentence: ['We', 'read', 'books', 'in', 'school.'] },
          { word: 'WATER', hi: 'पानी (Paani)', parts: ['W', 'A', 'T', 'E', 'R'], sentence: ['Raju', 'waters', 'the', 'green', 'plant.'] }

              </div>
            </div>
          </div>
        `;
      }

      // Default: 'fractions' — Fraction Kitchen (Chapati Circle SVG + Fraction Bar Strip)
      const denom = wl.fractionDenom || 4;
      const num = Math.min(denom, wl.fractionNum ?? 3);
      const pct = Math.round((num / denom) * 100);
      return `
        <div class="bg-purple-50/60 border border-purple-200/80 rounded-3xl p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">

            <div class="flex items-center gap-1.5">

                <button data-fk-num="${n}" class="fk-num-btn w-7 h-7 rounded-full font-extrabold border ${num === n ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-200'}">${n}</button>

                  return `
                    <button data-fk-num="${idx + 1}" class="fk-num-btn h-12 rounded-xl border-2 font-extrabold text-xs transition flex items-center justify-center ${shaded ? 'bg-amber-400 border-amber-600 text-slate-950' : 'bg-slate-50 border-slate-300 text-slate-400'}">
                      1/${denom}
                    </button>
                  `;
                }).join('')}
              </div>
              <div class="text-xs text-slate-700 bg-amber-50 rounded-xl p-2.5 border border-amber-200 font-semibold">
                💡 Notice: More equal slices means each individual 1/${denom} slice is ${denom > 2 ? 'smaller than ½!' : 'exactly half of the whole!'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function bindInteractivePlaygroundEvents() {
      const wl = state.wonderlab;

      document.querySelectorAll('.wl-playground-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const pgId = btn.getAttribute('data-playground-id');
          wl.activePlayground = pgId;
          const meta = WONDERLAB_PLAYGROUNDS_META.find(m => m.id === pgId);
          if (meta && meta.comp) {
            wl.competencyCode = meta.comp;
            wl.attemptSeed += 1;
            wl.generatedSet = generateCompetencyQuestionSet(wl.competencyCode, wl.questionCount, wl.difficulty, state.auth.studentId, wl.attemptSeed);
            wl.quizStep = 0;
            wl.quizStatus = 'in_progress';
          }
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.wl-mode-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          wl.learningMode = btn.getAttribute('data-wl-mode');
          saveState();
          renderApp();
        });
      });

      // Counting playground events
      document.querySelectorAll('.pg-icon-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          wl.countingIcon = btn.getAttribute('data-pg-icon');
          saveState();
          renderApp();
        });
      });
      document.querySelectorAll('.pg-count-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const op = btn.getAttribute('data-pg-count');
          if (op === 'a_add') wl.countingA = Math.min(15, (wl.countingA ?? 6) + 1);
          if (op === 'a_sub') wl.countingA = Math.max(0, (wl.countingA ?? 6) - 1);
          if (op === 'b_add') wl.countingB = Math.min(15, (wl.countingB ?? 5) + 1);
          if (op === 'b_sub') wl.countingB = Math.max(0, (wl.countingB ?? 5) - 1);
          saveState();
          renderApp();
        });
      });

      // Number line events
      document.querySelectorAll('.nl-start-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          wl.numberLineStart = Number(btn.getAttribute('data-nl-start'));
          saveState();
          renderApp();
        });
      });
      document.querySelectorAll('.nl-jump-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          wl.numberLineJump = Number(btn.getAttribute('data-nl-jump'));
          saveState();
          renderApp();
        });
      });

      // Base-ten workshop events
      document.querySelectorAll('.bt-op-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const op = btn.getAttribute('data-bt-op');
          if (op === 'add_ten') wl.baseTenTens = Math.min(9, (wl.baseTenTens ?? 4) + 1);
          else if (op === 'sub_ten') wl.baseTenTens = Math.max(0, (wl.baseTenTens ?? 4) - 1);
          else if (op === 'add_one') wl.baseTenOnes = Math.min(25, (wl.baseTenOnes ?? 12) + 1);
          else if (op === 'sub_one') wl.baseTenOnes = Math.max(0, (wl.baseTenOnes ?? 12) - 1);
          else if (op === 'unbundle') {
            if ((wl.baseTenTens ?? 4) > 0) {
              wl.baseTenTens -= 1;
              wl.baseTenOnes += 10;
              showToast('Unbundled 1 ten into 10 loose ones! Total value stays unchanged.', 'success');
            } else {
              showToast('Add at least 1 ten rod first to unbundle.');
            }
          } else if (op === 'bundle') {
            if ((wl.baseTenOnes ?? 12) >= 10) {
              wl.baseTenOnes -= 10;
              wl.baseTenTens += 1;
              showToast('Grouped 10 loose ones into 1 ten bundle!', 'success');
            } else {
              showToast('Need at least 10 loose ones to form 1 ten bundle.');
            }
          }
          saveState();
          renderApp();
        });
      });

      // Fraction kitchen events
      document.querySelectorAll('.fk-denom-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const d = Number(btn.getAttribute('data-fk-denom')) || 4;
          wl.fractionDenom = d;
          wl.fractionNum = Math.min(wl.fractionNum ?? 1, d);
          saveState();
          renderApp();
        });
      });
      document.querySelectorAll('.fk-num-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          wl.fractionNum = Number(btn.getAttribute('data-fk-num'));
          saveState();
          renderApp();
        });
      });

      // Shape explorer events
      document.querySelectorAll('.sh-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          wl.shapeType = btn.getAttribute('data-sh-type');
          saveState();
          renderApp();
        });
      });
      const rotBtn = document.getElementById('shRotateBtn');
      if (rotBtn) {
        rotBtn.addEventListener('click', () => {
          wl.shapeRotation = ((wl.shapeRotation || 0) + 45) % 360;
          saveState();
          renderApp();
        });
      }

      // Reading playground events
      const nextReadBtn = document.getElementById('pgNextReadingWordBtn');
      if (nextReadBtn) {
        nextReadBtn.addEventListener('click', () => {
          wl.readingWordIdx = (wl.readingWordIdx || 0) + 1;
          saveState();
          renderApp();
        });
      }
    }

    function bindWonderLabEvents() {
      const wl = state.wonderlab;
      bindInteractivePlaygroundEvents();

      const compSel = document.getElementById('wlCompetencySelect');
      if (compSel) {
        compSel.addEventListener('change', (e) => {
          wl.competencyCode = e.target.value;
          const mapInfo = COMPETENCY_TO_TOPIC_MAP[wl.competencyCode];
          if (mapInfo && mapInfo.playground) wl.activePlayground = mapInfo.playground;
          generateWonderLabQuestionsForCompetency(wl.competencyCode);
          saveState();
          renderApp();
        });
      }

      const cntSel = document.getElementById('wlQuestionCountSelect');
      if (cntSel) {
        cntSel.addEventListener('change', (e) => {
          wl.questionCount = Number(e.target.value) || 5;
          generateWonderLabQuestionsForCompetency(wl.competencyCode);
          saveState();
          renderApp();
        });
      }

      const genBtn = document.getElementById('wlGenerateQuestionsBtn');
      if (genBtn) {
        genBtn.addEventListener('click', () => {
          generateWonderLabQuestionsForCompetency(wl.competencyCode);
          saveState();
          showToast(`Generated ${wl.questionCount} distinct, competency-pure questions for ${wl.competencyCode}!`, 'success');
          renderApp();
        });
      }

      const assignBtn = document.getElementById('wlCreateAssignmentBtn');
      if (assignBtn) {
        assignBtn.addEventListener('click', () => {
          const grpSel = document.getElementById('wlTargetGroupSelect');
          const grp = grpSel ? grpSel.value : 'M3 · Eagles';
          wl.assignments.unshift({
            id: 'wl_' + Date.now(),
            title: `WonderLab Studio (${wl.competencyCode} · ${wl.questionCount} Qs)`,
            competencyCode: wl.competencyCode,
            questionCount: wl.questionCount,
            group: grp,
            assignedCount: 8,
            status: 'Active'
          });
          saveState();
          showToast(`Assigned WonderLab session (${wl.competencyCode}) to ${grp}!`, 'success');
          renderApp();
        });
      }

      const startBtn = document.getElementById('wlStartLiveQuizBtn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          generateWonderLabQuestionsForCompetency(wl.competencyCode);
          wl.activeQuizSession = true;
          saveState();
          showToast('Started fresh non-repeating WonderLab mission!', 'success');
          renderApp();
        });
      }

      const retakeBtn = document.getElementById('wlRetakeNewMissionBtn');
      if (retakeBtn) {
        retakeBtn.addEventListener('click', () => {
          generateWonderLabQuestionsForCompetency(wl.competencyCode);
          saveState();
          showToast('Generated new non-repeating question set!', 'success');
          renderApp();
        });
      }

      const openAbBtn = document.getElementById('wlOpenFullAssessBuilderBtn');
      if (openAbBtn) {
        openAbBtn.addEventListener('click', () => {
          state.assessSubTab = 'builder';
          state.assessBuilder.competencyCode = wl.competencyCode;
          switchTab('diagnostic');
        });
      }

      // FINITE QUESTION ADVANCEMENT (Never loops back with % generatedSet.length!)
      document.querySelectorAll('.wl-option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (wl.quizStatus === 'results') return;
          const picked = btn.getAttribute('data-wl-answer');
          const qList = wl.generatedSet || [];
          const currQ = qList[wl.quizStep];
          if (currQ && picked === currQ.ans) {
            wl.quizScore += 1;
            wl.streakCount = (wl.streakCount || 0) + 1;
            showToast('Correct! Great conceptual understanding.', 'success');
          } else {
            wl.streakCount = 0;
            showToast(`Not quite! ${currQ ? currQ.explanation : ''}`);
          }

          if (wl.quizStep + 1 < qList.length) {
            wl.quizStep += 1;
          } else {
            wl.quizStatus = 'results';
            // If in Assess mode, record evidence for the selected student
            if (wl.learningMode === 'Assess') {
              const stu = state.students.find(s => s.id === state.auth.studentId) || state.students[0];
              const pct = Math.round((wl.quizScore / Math.max(1, qList.length)) * 100);
              recordCompletedAssessmentEvidence(stu, wl.competencyCode, pct, wl.quizScore, qList.length, 'WonderLab Assess Mission');
            }
          }
          saveState();
          renderApp();
        });
      });
    }

    function generateWonderLabQuestionsForCompetency(code) {
      const wl = state.wonderlab;
      wl.attemptSeed = (wl.attemptSeed || 1) + 1;
      wl.generatedSet = generateCompetencyQuestionSet(
        code || wl.competencyCode || 'NIPUN-M3-02',
        wl.questionCount || 5,
        wl.difficulty || 'Balanced Progression',
        state.auth.studentId || 1,
        wl.attemptSeed
      );
      wl.quizStep = 0;
      wl.quizScore = 0;
      wl.quizStatus = 'in_progress';
      wl.quizAnswers = {};
    }

    function bindClassSetupEvents() {
      document.querySelectorAll('.admin-class-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          switchClass(btn.getAttribute('data-admin-switch-class'));
        });
      });

      const saveClassMeta = () => {
        const t = document.getElementById('inputTeacherName');
        const s = document.getElementById('inputSchoolName');
        const c = document.getElementById('inputClassName');
        const g = document.getElementById('inputGradeSelect');
        const y = document.getElementById('inputAcademicYear');
        if (t) state.classInfo.teacher = t.value.trim() || 'Ravi Arora';
        if (s) state.classInfo.school = s.value.trim() || 'Govt. Primary School, Nangal';
        if (c) state.classInfo.className = c.value.trim() || 'Grade 3A';
        if (g) state.classInfo.grade = g.value;
        if (y) state.classInfo.academicYear = y.value.trim() || '2026–27';
        saveState();
        applyThemeAndHeaderState();
      };

      ['inputTeacherName', 'inputSchoolName', 'inputClassName', 'inputGradeSelect', 'inputAcademicYear'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', () => {
          saveClassMeta();
          showToast('Saved class settings.', 'success');
        });
      });

      const explicitSaveBtn = document.getElementById('saveAdminClassSettingsBtn');
      if (explicitSaveBtn) {
        explicitSaveBtn.addEventListener('click', () => {
          saveClassMeta();
          renderApp();
          showToast('Class setup and school details saved!', 'success');
        });
      }

      const addSingleStudentAction = () => {
        const nameInput = document.getElementById('newStudentNameInput');
        const rollInput = document.getElementById('newStudentRollInput');
        const genderSel = document.getElementById('newStudentGenderSelect');
        const name = (nameInput ? nameInput.value : '').trim();
        if (!name) {
          showToast('Please enter a student name.');
          return;
        }
        const requestedRoll = rollInput ? parseInt(rollInput.value, 10) : 1;
        const targetRoll = (!isNaN(requestedRoll) && requestedRoll >= 1) ? requestedRoll : (state.students.length + 1);
        const hadCollision = state.students.some(s => s.roll === targetRoll);
        const nextId = state.students.reduce((m, s) => Math.max(m, s.id), 0) + 1;

        insertStudentWithRollShift({
          id: nextId,
          roll: targetRoll,
          name,
          gender: genderSel ? genderSel.value : 'F',
          grade: state.classInfo.grade,
          rBase: 'R1',
          rCurr: 'R1',
          mBase: 'M1',
          mCurr: 'M1',
          rScore: 50,
          mScore: 50,
          lastAssessed: 'Not yet',
          notes: 'Newly added student.',
          interventions: []
        });

        saveState();
        if (hadCollision) {
          showToast(`Added ${name} at Roll #${targetRoll} and shifted previous Roll #${targetRoll}+ up by 1!`, 'success');
        } else {
          showToast(`Added #${targetRoll} ${name} to ${state.classInfo.className}.`, 'success');
        }
        renderApp();
      };

      const addBtn = document.getElementById('addSingleStudentBtn');
      if (addBtn) {
        addBtn.addEventListener('click', addSingleStudentAction);
      }

      const nameInp = document.getElementById('newStudentNameInput');
      if (nameInp) {
        nameInp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addSingleStudentAction();
        });
      }

      document.querySelectorAll('.remove-student-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = Number(btn.getAttribute('data-remove-student'));
          const removed = removeStudentAndRenumber(sid);
          saveState();
          if (removed) {
            showToast(`Removed #${removed.roll} ${removed.name} and updated subsequent Roll numbers.`);
          }
          renderApp();
        });
      });

      const csvInput = document.getElementById('csvFileInput');
      if (csvInput) {
        csvInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const ta = document.getElementById('bulkCsvTextarea');
            if (ta) ta.value = String(reader.result || '');
          };
          reader.readAsText(file);
        });
      }

      const importBtn = document.getElementById('importBulkCsvBtn');
      if (importBtn) {
        importBtn.addEventListener('click', () => {
          const ta = document.getElementById('bulkCsvTextarea');
          const raw = (ta ? ta.value : '').trim();
          if (!raw) {
            showToast('Paste CSV lines (e.g. Asha, 1, F) before importing.');
            return;
          }
          const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          let addedCount = 0;
          lines.forEach(line => {
            const parts = line.split(',').map(p => p.trim());
            const name = parts[0];
            if (!name) return;
            const nextId = state.students.reduce((m, s) => Math.max(m, s.id), 0) + 1;
            const parsedRoll = parseInt(parts[1], 10);
            const roll = (!isNaN(parsedRoll) && parsedRoll >= 1) ? parsedRoll : (state.students.length + 1);
            const gender = (parts[2] || 'F').toUpperCase().startsWith('M') ? 'M' : 'F';
            insertStudentWithRollShift({
              id: nextId,
              roll,
              name,
              gender,
              grade: state.classInfo.grade,
              rBase: 'R1',
              rCurr: 'R1',
              mBase: 'M1',
              mCurr: 'M1',
              rScore: 50,
              mScore: 50,
              lastAssessed: 'Not yet',
              notes: 'Imported via CSV.',
              interventions: []
            });
            addedCount += 1;
          });
          if (addedCount > 0) {
            saveState();
            showToast(`Imported ${addedCount} student${addedCount > 1 ? 's' : ''} with automatic Roll # ordering!`, 'success');
            renderApp();
          }
        });
      }

      const resetDemoBtn = document.getElementById('resetDemoDataBtn');
      if (resetDemoBtn) {
        resetDemoBtn.addEventListener('click', () => {
          state = createInitialState();
          state.activeTab = 'class';
          saveState();
          showToast('Demo data restored across all 3 classrooms.', 'success');
          renderApp();
        });
      }
    }

                      <button data-stu-ans="${escapeHtml(opt)}" class="stu-quiz-opt-btn py-3 px-4 rounded-2xl bg-white hover:bg-purple-600 hover:text-white text-slate-900 font-extrabold text-sm border border-slate-200 shadow-2xs transition text-left">
                        ${escapeHtml(opt)}
                      </button>
                    `).join('')}
                  </div>
                  <div class="text-xs text-slate-600 bg-white/90 rounded-2xl p-3 border border-slate-200/70">
                    💡 <span class="font-bold">Helper Hint:</span> ${escapeHtml(qItem.hint)}
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      } else {
        // My Assigned Sheets section
        const rSheets = PRACTICE_SHEETS_CATALOG.reading[stu.rCurr] || PRACTICE_SHEETS_CATALOG.reading.R2;
        const mSheets = PRACTICE_SHEETS_CATALOG.math[stu.mCurr] || PRACTICE_SHEETS_CATALOG.math.M2;
        const mySheets = [...rSheets, ...mSheets];

        sectionHtml = `
          <div class="glass-card rounded-3xl p-6 space-y-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900">📝 Practice Sheets Tailored for ${escapeHtml(stu.name)} (${stu.rCurr} &amp; ${stu.mCurr})</h2>
              <p class="text-xs text-slate-500">Complete these 10-question practice sets in your notebook and mark them done!</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${mySheets.map(sh => {
                const done = sp.completedSheets.includes(sh.id);
                return `
                  <div class="bg-slate-50/90 rounded-3xl p-5 border border-slate-200/80 space-y-3 flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between">
                        <span class="text-[11px] font-mono font-bold text-blue-600">${escapeHtml(sh.qrCode)} · ${escapeHtml(sh.competency)}</span>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${done ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                          ${done ? '✓ Completed' : 'Assigned'}
                        </span>
                      </div>
                      <h3 class="text-base font-extrabold text-slate-900 mt-1">${escapeHtml(sh.title)}</h3>
                      <p class="text-xs text-slate-500">${escapeHtml(sh.subtitle)}</p>
                      <div class="mt-3 space-y-1 text-xs text-slate-700 bg-white p-3 rounded-2xl border border-slate-200/60">
                        ${sh.questions.slice(0, 3).map((q, i) => `<div>${i + 1}. ${escapeHtml(q.text)}</div>`).join('')}
                      </div>
                    </div>
                    <button data-complete-sheet="${sh.id}" class="stu-complete-sheet-btn w-full py-2.5 rounded-full text-xs font-extrabold transition ${done ? 'bg-emerald-600 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white'}">
                      ${done ? '✓ Marked Complete (+1 Star)' : 'Mark Worksheet Complete'}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-6">
          <!-- Student Banner Header -->
          <div class="glass-card rounded-3xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-2xl bg-purple-600 text-white font-extrabold text-2xl flex items-center justify-center shadow-md">
                ${escapeHtml(stu.name[0])}
              </div>
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-purple-600">
                  🎒 Personalized Student Learning Hub · Roll #${stu.roll} · ${escapeHtml(state.classInfo.className)}
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 mt-0.5">
                  ${state.lang === 'hi' ? `नमस्ते, ${escapeHtml(stu.name)}! 🌟` : `Hello, ${escapeHtml(stu.name)}! 🌟`}
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">
                  Reading Group: <span class="font-bold">${stu.rCurr} (${escapeHtml(rMeta.name)})</span> · Math Group: <span class="font-bold">${stu.mCurr} (${escapeHtml(mMeta.name)})</span>
                </p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <select id="stuPortalSwitchLearnerSelect" class="rounded-full bg-slate-100 border border-slate-200 px-3.5 py-2 text-xs font-bold text-slate-800">
                ${state.students.map(s => `<option value="${s.id}" ${s.id === stu.id ? 'selected' : ''}>Switch Learner: #${s.roll} ${escapeHtml(s.name)}</option>`).join('')}
              </select>
              <button id="studentSignOutToTeacherBtn" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-full transition">
                Sign Out → Teacher View
              </button>
            </div>
          </div>

          <!-- Section Quick Pills -->
          <div class="student-section-pills flex flex-wrap gap-2">
            <button data-stu-sec="journey" class="stu-sec-pill px-4 py-2 rounded-full text-xs font-extrabold border transition ${sp.activeSection === 'journey' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-slate-700 border-slate-200'}">
              🗺️ My Learning Journey
            </button>
            <button data-stu-sec="manipulatives" class="stu-sec-pill px-4 py-2 rounded-full text-xs font-extrabold border transition ${sp.activeSection === 'manipulatives' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-slate-700 border-slate-200'}">
              🧮 Interactive Manipulatives
            </button>
            <button data-stu-sec="practice" class="stu-sec-pill px-4 py-2 rounded-full text-xs font-extrabold border transition ${sp.activeSection === 'practice' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-slate-700 border-slate-200'}">
              🎯 Stories &amp; Adaptive Practice
            </button>
            <button data-stu-sec="worksheets" class="stu-sec-pill px-4 py-2 rounded-full text-xs font-extrabold border transition ${sp.activeSection === 'worksheets' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-slate-700 border-slate-200'}">
              📝 My Assigned Sheets
            </button>
          </div>

          ${sectionHtml}
        </div>
      `;
    }

    function bindStudentPortalEvents() {
      const signOutBtn = document.getElementById('studentSignOutToTeacherBtn');
      if (signOutBtn) {
        signOutBtn.addEventListener('click', () => {
          state.auth.role = 'teacher';
          saveState();
          showToast('Signed out of Student Mode. Returned to Teacher Toolkit.', 'success');
          renderApp();
        });
      }

      const switchStuSel = document.getElementById('stuPortalSwitchLearnerSelect');
      if (switchStuSel) {
        switchStuSel.addEventListener('change', (e) => {
          state.auth.studentId = Number(e.target.value);
          saveState();
          renderApp();
        });
      }

      document.querySelectorAll('.stu-sec-pill, .stu-goto-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-stu-sec') || btn.getAttribute('data-stu-goto');
          if (target) {
            state.studentPortal.activeSection = target;
            saveState();
            renderApp();
          }
        });
      });

      // Manipulatives events
      const addTen = document.getElementById('stuAddTenBtn');
      if (addTen) addTen.addEventListener('click', () => { state.studentPortal.stickTens = Math.min(9, state.studentPortal.stickTens + 1); saveState(); renderApp(); });

      const subTen = document.getElementById('stuSubTenBtn');
      if (subTen) subTen.addEventListener('click', () => { state.studentPortal.stickTens = Math.max(0, state.studentPortal.stickTens - 1); saveState(); renderApp(); });

      const addOne = document.getElementById('stuAddOneBtn');
      if (addOne) addOne.addEventListener('click', () => { state.studentPortal.stickOnes = Math.min(19, state.studentPortal.stickOnes + 1); saveState(); renderApp(); });

      const subOne = document.getElementById('stuSubOneBtn');
      if (subOne) subOne.addEventListener('click', () => { state.studentPortal.stickOnes = Math.max(0, state.studentPortal.stickOnes - 1); saveState(); renderApp(); });

      const unbundleBtn = document.getElementById('stuUnbundleTenBtn');
      if (unbundleBtn) {
        unbundleBtn.addEventListener('click', () => {
          if (state.studentPortal.stickTens > 0) {
            state.studentPortal.stickTens -= 1;
            state.studentPortal.stickOnes += 10;
            saveState();
            showToast('Unbundled 1 ten into 10 loose ones! Notice the total number stays the same.', 'success');
            renderApp();
          } else {
            showToast('Add at least 1 ten-bundle first to unbundle!');
          }
        });
      }

      document.querySelectorAll('.stu-slice-count-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const n = Number(btn.getAttribute('data-set-slices')) || 4;
          state.studentPortal.chapatiSlices = n;
          state.studentPortal.shadedSlices = Math.min(state.studentPortal.shadedSlices, n);
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.stu-shade-box-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.studentPortal.shadedSlices = Number(btn.getAttribute('data-shade-idx')) || 1;
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.stu-sound-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.studentPortal.selectedSoundIndex = Number(btn.getAttribute('data-sound-idx')) || 0;
          saveState();
          renderApp();
        });
      });

      const nextStoryBtn = document.getElementById('stuNextStoryBtn');
      if (nextStoryBtn) {
        nextStoryBtn.addEventListener('click', () => {
          state.studentPortal.storyIndex = (state.studentPortal.storyIndex + 1) % STUDENT_STORIES.length;
          saveState();
          renderApp();
        });
      }

      document.querySelectorAll('.stu-story-ans-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const picked = btn.getAttribute('data-story-ans');
          const story = STUDENT_STORIES[state.studentPortal.storyIndex % STUDENT_STORIES.length];
          if (story && picked === story.ans) {
            state.wonderlab.quizScore += 1;
            saveState();
            showToast('🌟 Correct story comprehension! +1 Star earned!', 'success');
            renderApp();
          } else {
            showToast('Re-read the highlighted story lines and try again!');
          }
        });
      });

      const freshStuBtn = document.getElementById('stuStartFreshAdaptiveSetBtn');
      if (freshStuBtn) {
        freshStuBtn.addEventListener('click', () => {
          const stu = state.students.find(s => s.id === state.auth.studentId) || state.students[0];
          const targetComp = stu.mCurr === 'M1' ? 'NIPUN-M1-02' : stu.mCurr === 'M2' ? 'NIPUN-M3-01' : 'NIPUN-M3-02';
          state.wonderlab.competencyCode = targetComp;
          generateWonderLabQuestionsForCompetency(targetComp);
          saveState();
          showToast('Generated a fresh 5-question personalized mission!', 'success');
          renderApp();
        });
      }

      document.querySelectorAll('.stu-quiz-opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const wl = state.wonderlab;
          if (wl.quizStatus === 'results') return;
          const picked = btn.getAttribute('data-stu-ans');
          const currQ = wl.generatedSet[wl.quizStep];
          const stu = state.students.find(s => s.id === state.auth.studentId) || state.students[0];
          if (currQ && picked === currQ.ans) {
            wl.quizScore += 1;
            showToast('🌟 Shabash! Correct answer!', 'success');
          } else {
            showToast(`Hint: ${currQ ? currQ.explanation : ''}`);
          }
          if (stu && currQ && Array.isArray(stu.seenQuestionSignatures) && !stu.seenQuestionSignatures.includes(currQ.canonicalSignature)) {
            stu.seenQuestionSignatures.push(currQ.canonicalSignature);
          }
          if (wl.quizStep + 1 < wl.generatedSet.length) {
            wl.quizStep += 1;
          } else {
            wl.quizStatus = 'results';
            if (stu) {
              if (!Array.isArray(stu.practiceLog)) stu.practiceLog = [];
              stu.practiceLog.unshift({ comp: wl.competencyCode, score: wl.quizScore, total: wl.generatedSet.length, date: 'Just now' });
            }
          }
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.stu-complete-sheet-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const shId = btn.getAttribute('data-complete-sheet');
          if (!state.studentPortal.completedSheets.includes(shId)) {
            state.studentPortal.completedSheets.push(shId);
            state.wonderlab.quizScore += 1;
            saveState();
            showToast('Worksheet marked complete! +1 Star earned!', 'success');
            renderApp();
          }
        });
      });
    }

    // ============================================================================
    // ROLE SWITCHER MODAL (Teacher Sign-In / Student Sign-In / Sign-Out)
    // ============================================================================
    function openAuthModal() {
      const overlay = document.getElementById('authModalOverlay');
      const content = document.getElementById('authModalContent');
      if (!overlay || !content) return;

      content.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div>
            <h3 class="text-lg font-extrabold text-slate-900">Switch demo view</h3>
            <p class="text-xs text-slate-500">This is a local demo. Choose which view to explore; no account sign-in occurs.</p>
          </div>
          <button aria-label="Close view switcher" id="closeAuthModalBtn" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">✕</button>
        </div>

        <div class="space-y-4 mt-4">
          <div class="rounded-2xl p-4 border ${state.auth.role === 'teacher' ? 'bg-blue-50/80 border-blue-500' : 'bg-slate-50 border-slate-200'} space-y-2">
            <div class="flex items-center justify-between">
              <div class="text-sm font-extrabold text-slate-900">👩‍🏫 Teacher view (${escapeHtml(state.classInfo.teacher)})</div>
              ${state.auth.role === 'teacher' ? `<span class="text-[11px] font-bold bg-blue-600 text-white px-2.5 py-0.5 rounded-full">Active</span>` : ''}
            </div>
            <p class="text-xs text-slate-600">Full access to Diagnose, Smart Grouping, Printable QR Sheets, and Class/Student Progress Reports.</p>
            <button id="authSwitchTeacherBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-full transition">
              Open teacher view
            </button>
          </div>

          <div class="rounded-2xl p-4 border ${state.auth.role === 'student' ? 'bg-purple-50/80 border-purple-500' : 'bg-slate-50 border-slate-200'} space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="text-sm font-extrabold text-slate-900">🎒 Student view (choose a learner)</div>
              ${state.auth.role === 'student' ? `<span class="text-[11px] font-bold bg-purple-600 text-white px-2.5 py-0.5 rounded-full">Active</span>` : ''}
            </div>
            <p class="text-xs text-slate-600">Personalized learning roadmap, interactive Neem-Stick &amp; Chapati fraction manipulatives, bilingual stories, and assigned worksheets.</p>
            <label for="authStudentPickerSelect" class="block text-sm font-semibold">Learner</label>
            <select id="authStudentPickerSelect" class="w-full rounded-xl bg-white border border-slate-200 px-3 py-2 text-xs font-bold text-slate-800">
              ${state.students.map(s => `<option value="${s.id}" ${s.id === state.auth.studentId ? 'selected' : ''}>#${s.roll} ${escapeHtml(s.name)} (${s.rCurr} / ${s.mCurr})</option>`).join('')}
            </select>
            <button id="authSwitchStudentBtn" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-2 rounded-full transition">
              Open student view
            </button>
          </div>
        </div>
      `;

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      document.getElementById('closeAuthModalBtn').addEventListener('click', closeAuthModal);
      document.getElementById('authSwitchTeacherBtn').addEventListener('click', () => {
        state.auth.role = 'teacher';
        saveState();
        closeAuthModal();
        showToast(`Opened teacher view (${state.classInfo.teacher}).`, 'success');
        renderApp();
      });
      document.getElementById('authSwitchStudentBtn').addEventListener('click', () => {
        const sel = document.getElementById('authStudentPickerSelect');
        state.auth.role = 'student';
        state.auth.studentId = sel ? Number(sel.value) : state.students[0].id;
        saveState();
        closeAuthModal();
        showToast('Opened student view on this device.', 'success');
        renderApp();
      });
    }

    function closeAuthModal() {
      const overlay = document.getElementById('authModalOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
    }

    // ============================================================================
    // LUMI AI CLASSROOM ASSISTANT DRAWER
    // ============================================================================
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.getAttribute('data-tab'));
        });
      });

      document.querySelectorAll('.stu-nav-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.studentPortal.activeSection = btn.getAttribute('data-stu-tab');
          toggleMobileSidebar(false);
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.mobile-nav-btn[data-mobile-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.getAttribute('data-mobile-tab'));
        });
      });

      const mobMoreBtn = document.getElementById('mobileMoreMenuBtn');
      if (mobMoreBtn) mobMoreBtn.addEventListener('click', () => toggleMobileSidebar(true));

      const openMobBtn = document.getElementById('openMobileSidebarBtn');
      if (openMobBtn) openMobBtn.addEventListener('click', () => toggleMobileSidebar(true));

      const closeMobBtn = document.getElementById('closeMobileSidebarBtn');
      if (closeMobBtn) closeMobBtn.addEventListener('click', () => toggleMobileSidebar(false));

      const mobBackdrop = document.getElementById('mobileSidebarBackdrop');
      if (mobBackdrop) mobBackdrop.addEventListener('click', () => toggleMobileSidebar(false));

      const brandBtn = document.getElementById('brandHomeBtn');
      if (brandBtn) brandBtn.addEventListener('click', () => {
        if (typeof accountProfile !== 'undefined' && accountProfile?.role === 'student') { uxNavigate('home'); return; }
        state.auth.role = 'teacher';
        switchTab('dashboard');
      });

      const avatarBtn = document.getElementById('avatarProfileBtn');
      if (avatarBtn) avatarBtn.addEventListener('click', () => {
        state.auth.role = 'teacher';
        switchTab('class');
      });

      const classSelect = document.getElementById('globalClassSelect');
      if (classSelect) {
        classSelect.addEventListener('change', (e) => {
          switchClass(e.target.value);
        });
      }

      const langBtn = document.getElementById('langToggleBtn');
      if (langBtn) {
        langBtn.addEventListener('click', () => {
          state.lang = state.lang === 'en' ? 'hi' : 'en';
          saveState();
          showToast(state.lang === 'hi' ? 'भाषा हिंदी में बदल गई (Bilingual Mode Active)' : 'Switched language to English');
          renderApp();
        });
      }

      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          state.darkMode = !state.darkMode;
          saveState();
          renderApp();
        });
      }

      const roleBtn = document.getElementById('roleSwitchModalBtn');
      if (roleBtn) roleBtn.addEventListener('click', openAuthModal);

      const modalOverlay = document.getElementById('studentModalOverlay');
      if (modalOverlay) {
        modalOverlay.addEventListener('click', (e) => {
          if (e.target === modalOverlay) closeStudentModal();
        });
      }

      const authOverlay = document.getElementById('authModalOverlay');
      if (authOverlay) {
        authOverlay.addEventListener('click', (e) => {
          if (e.target === authOverlay) closeAuthModal();
        });
      }

      renderApp();
    });
  </script>
  <script src="design.js"></script>
  <script src="ux.js"></script>
  <script src="elevenlabs-widget.js"></script>
  <script src="supabase-config.js"></script>
  <script src="account.js"></script>
